      rockets.push({ x: paddle.x + paddle.w / 2 - 4, y: paddle.y - 4, w: 8, h: 18, vy: -LASER_SPEED * 0.8 });
      effects.rocketCooldown = effectRank('rocket') >= 2 ? 0.55 : 0.9;
      playSound('pew');
    }
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.y += r.vy * dt;
    let hit = false;
    if (obstacle && r.x < obstacle.x + obstacle.w && r.x + r.w > obstacle.x && r.y < obstacle.y + obstacle.h && r.y + r.h > obstacle.y) {
      hit = true;
      triggerShake(5, 0.15);
      vibrate([20, 30, 20]);
      spawnParticles(r.x + r.w / 2, r.y, '#ff5722', 10, 150);
    }
    if (!hit) {
      for (const b of bricks) {
        if (!b.alive) continue;
        if (r.x < b.x + b.w && r.x + r.w > b.x && r.y < b.y + b.h && r.y + r.h > b.y) {
          hit = true;
          const cx = b.x + b.w / 2, cy = b.y + b.h / 2, radius = b.w * 1.6;
          triggerShake(7, 0.2);
          triggerHitStop(0.05);
          vibrate([30, 50, 30]);
          spawnParticles(cx, cy, '#ff5722', 18, 210);
          hitBrick(b);
          bricks.forEach(other => {
            if (!other.alive || other.steel || other === b || other.isBoss) return;
            const ocx = other.x + other.w / 2, ocy = other.y + other.h / 2;
            if (Math.hypot(ocx - cx, ocy - cy) < radius) destroyBrick(other, true);
          });
          break;
        }
      }
    }
    if (hit || r.y < 0) rockets.splice(i, 1);
  }

  const rampFactor = endlessMode ? 1 : 1 + Math.min(RAMP_MAX, (elapsedPlayTime / RAMP_DURATION) * RAMP_MAX);
  const slowFactor = effectRank('slow') <= 0 ? 1 : (effectRank('slow') >= 2 ? 0.38 : 0.55);
  const fastFactor = effectRank('fastball') <= 0 ? 1 : (effectRank('fastball') >= 2 ? 1.95 : 1.5);
  const speedFactor = rampFactor * slowFactor * fastFactor * (feverTimer > 0 ? 1.16 : 1) * (tuftMode ? 0.64 : 1);
  const maxSpeed = MAX_SPEED_BASE * currentSpeedMult();

  balls.forEach(ball => updateBall(ball, dt, speedFactor, maxSpeed));
  balls = balls.filter(b => !b.dead);

  tickParticles(dt);
  tickFloats(dt);

  if (!tuftMode && bricks && bricks.length && remainingBreakable() <= 0) {
    if (lastBrickSlow <= 0) {
      maybeGrantCleanClear();
      droppedBallThisLevel = false;
      cleanAwardedForClear = false;
      lastBrickSlow = 0;
      if (descendMode) {
        descendWave++;
        if (descendWave > descendBest) { descendBest = descendWave; saveDescendBest(descendBest); }
        layoutDescendWave(descendWave);
        updateLevelHud();
        playSound('levelup');
      } else {
        advanceLevelSeamlessly();
        return;
      }
    }
  }
  if (balls.length === 0 && (tuftMode || remainingBreakable() > 0)) handleAllBallsLost();
}

function drawPowerIcon(type, cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#fff';
  ctx.lineWidth = 1.7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  if (type === 'wide') {
    ctx.fillRect(-s, -s * 0.28, s * 2, s * 0.56);
  } else if (type === 'shrink') {
    ctx.fillRect(-s * 0.55, -s * 0.28, s * 1.1, s * 0.56);
  } else if (type === 'slow') {
    line(-s * 0.15, -s * 0.55, -s * 0.75, 0);
    line(-s * 0.15, s * 0.55, -s * 0.75, 0);
    line(s * 0.55, -s * 0.55, -s * 0.05, 0);
    line(s * 0.55, s * 0.55, -s * 0.05, 0);
  } else if (type === 'fastball') {
    line(-s * 0.55, -s * 0.55, s * 0.15, 0);
    line(-s * 0.55, s * 0.55, s * 0.15, 0);
    line(s * 0.05, -s * 0.55, s * 0.75, 0);
    line(s * 0.05, s * 0.55, s * 0.75, 0);
  } else if (type === 'sticky') {
    ctx.beginPath(); ctx.arc(0, s * 0.15, s * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-s * 0.18, -s * 0.85, s * 0.36, s * 0.7);
  } else if (type === 'laser') {
    ctx.fillRect(-s * 0.7, -s * 0.85, s * 0.28, s * 1.7);
    ctx.fillRect(s * 0.42, -s * 0.85, s * 0.28, s * 1.7);
  } else if (type === 'fireball') {
    ctx.beginPath(); ctx.arc(0, s * 0.12, s * 0.48, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -s * 0.85); ctx.lineTo(s * 0.32, -s * 0.1); ctx.lineTo(-s * 0.32, -s * 0.1); ctx.closePath(); ctx.fill();
  } else if (type === 'bomb') {
    ctx.beginPath(); ctx.arc(0, s * 0.12, s * 0.58, 0, Math.PI * 2); ctx.fill();
    line(s * 0.28, -s * 0.35, s * 0.62, -s * 0.78);
  } else if (type === 'doublescore') {
    ctx.font = 'bold ' + Math.round(s * 1.35) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('x2', 0, 1);
  } else if (type === 'multi') {
    ctx.beginPath(); ctx.arc(-s * 0.4, 0, s * 0.38, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.42, 0, s * 0.38, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'life') {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.55);
    ctx.bezierCurveTo(-s * 1.05, -s * 0.15, -s * 0.45, -s * 0.95, 0, -s * 0.35);
    ctx.bezierCurveTo(s * 0.45, -s * 0.95, s * 1.05, -s * 0.15, 0, s * 0.55);
    ctx.fill();
  } else if (type === 'shield') {
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.75);
    ctx.lineTo(s * 0.7, -s * 0.35);
    ctx.lineTo(s * 0.55, s * 0.35);
    ctx.lineTo(0, s * 0.8);
    ctx.lineTo(-s * 0.55, s * 0.35);
    ctx.lineTo(-s * 0.7, -s * 0.35);
    ctx.closePath(); ctx.stroke();
  } else if (type === 'reverse') {
    line(-s * 0.75, 0, s * 0.75, 0);
    line(-s * 0.75, 0, -s * 0.3, -s * 0.4);
    line(-s * 0.75, 0, -s * 0.3, s * 0.4);
    line(s * 0.75, 0, s * 0.3, -s * 0.4);
    line(s * 0.75, 0, s * 0.3, s * 0.4);
  } else if (type === 'clumsy') {
    ctx.beginPath();
    ctx.moveTo(-s * 0.8, s * 0.2);
    ctx.quadraticCurveTo(-s * 0.25, -s * 0.7, 0, 0.1);
    ctx.quadraticCurveTo(s * 0.25, s * 0.7, s * 0.8, -s * 0.15);
    ctx.stroke();
  } else if (type === 'pierce') {
    line(-s * 0.85, 0, s * 0.85, 0);
    line(s * 0.3, -s * 0.4, s * 0.85, 0);
    line(s * 0.3, s * 0.4, s * 0.85, 0);
    ctx.beginPath(); ctx.arc(0, 0, s * 0.28, 0, Math.PI * 2); ctx.stroke();
  } else if (type === 'rocket') {
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.85);
    ctx.lineTo(s * 0.42, s * 0.2);
    ctx.lineTo(-s * 0.42, s * 0.2);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-s * 0.18, s * 0.15, s * 0.36, s * 0.5);
  } else if (type === 'mirror') {
    ctx.fillRect(-s * 0.75, -s * 0.7, s * 0.28, s * 1.4);
    ctx.fillRect(s * 0.47, -s * 0.7, s * 0.28, s * 1.4);
    line(-s * 0.35, 0, s * 0.35, 0);
  } else if (type === 'net') {
    line(-s * 0.7, -s * 0.35, s * 0.7, -s * 0.35);
    line(-s * 0.7, s * 0.35, s * 0.7, s * 0.35);
    line(-s * 0.35, -s * 0.7, -s * 0.35, s * 0.7);
    line(s * 0.35, -s * 0.7, s * 0.35, s * 0.7);
  } else if (type === 'lock') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.72, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'lightning') {
    ctx.beginPath();
    ctx.moveTo(s * 0.2, -s * 0.88);
    ctx.lineTo(-s * 0.45, 0.05);
    ctx.lineTo(s * 0.1, 0.05);
    ctx.lineTo(-s * 0.2, s * 0.88);
    ctx.lineTo(s * 0.55, -s * 0.15);
    ctx.lineTo(0, -s * 0.15);
  } else if (type === 'drone') {
    ctx.fillRect(-s * 0.45, -s * 0.25, s * 0.9, s * 0.5);
    line(-s * 0.75, -s * 0.5, s * 0.75, -s * 0.5);
    ctx.beginPath(); ctx.arc(-s * 0.75, -s * 0.5, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.75, -s * 0.5, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2); ctx.fillStyle = '#00e676'; ctx.fill();
  } else if (type === 'chrono') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, Math.PI * 2); ctx.stroke();
    line(0, 0, 0, -s * 0.45);
    line(0, 0, s * 0.4, 0);
  } else if (type === 'vortex') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, Math.PI * 0.5, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function resetPlayDraw() {
  try {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'rgba(0,0,0,0)';
  } catch (e) {}
}

function drawArcadeBorders() {
  if (typeof isPixelArt === 'function' && isPixelArt()) {
    const world = pixelWorld();
    ctx.fillStyle = world.bg;
    ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#ffffff';
    const cell = 8;
    for (let gy = 0; gy < VH; gy += cell) {
      for (let gx = ((gy / cell) | 0) % 2 ? cell : 0; gx < VW; gx += cell * 2) {
        ctx.fillRect(gx, gy, cell, cell);
      }
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(0, 0, VW, 18);
    ctx.fillRect(0, VH - 28, VW, 28);
    ctx.strokeStyle = world.bricks[0];
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, VW - 4, VH - 4);
    ctx.globalAlpha = 1;
    return;
  }
  const theme = themeForLevel();
  const themeColor = (theme.bricks && theme.bricks[0]) || '#40c4ff';

  // --- 0. Ambient Bounce Light (Tuğla Rengi Ortam Işıması) ---
  if (ambientFlash.intensity > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const bgRad = Math.max(VW, VH) * 0.85;
    const ag = ctx.createRadialGradient(VW / 2, VH * 0.35, 20, VW / 2, VH * 0.35, bgRad);
    ag.addColorStop(0, ambientFlash.color);
    ag.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = ambientFlash.intensity * 0.28;
    ctx.fillStyle = ag;
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
  }

  // --- 0.b Kozmik Yıldız Tozları (Floating Stardust) ---
  if (stardust.length > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    stardust.forEach(s => {
      const pAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.pulse));
      ctx.fillStyle = 'rgba(255,255,255,' + pAlpha + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // --- 0.c Soft floor lines (kombo’da hafif nabız, neon yok) ---
  ctx.save();
  const cPulse = (combo >= 8) ? (0.018 + Math.min(0.03, combo * 0.002)) : 0.01;
  ctx.strokeStyle = 'rgba(255,255,255,' + cPulse + ')';
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
  const gridOffset = (globalTime * 8) % 48;
  for (let gy = VH * 0.72 + gridOffset; gy < VH; gy += 48) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(VW, gy);
    ctx.stroke();
  }
  ctx.restore();

  // --- 1. Soft derinlik vinyeti ---
  const vg = ctx.createLinearGradient(0, 0, 0, VH);
  vg.addColorStop(0, 'rgba(6,7,12,0.28)');
  vg.addColorStop(0.22, 'rgba(0,0,0,0)');
  vg.addColorStop(0.78, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(4,5,8,0.36)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);

  // --- 2. Duvar hatları (ince, soft) ---
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = themeColor;
  ctx.globalAlpha = 0.18 + 0.04 * Math.sin(globalTime * 2.2);
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(1.5, VH);
  ctx.lineTo(1.5, 1.5);
  ctx.lineTo(VW - 1.5, 1.5);
  ctx.lineTo(VW - 1.5, VH);
  ctx.stroke();

  // İç soft sınır
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(1.5, VH);
  ctx.lineTo(1.5, 1.5);
  ctx.lineTo(VW - 1.5, 1.5);
  ctx.lineTo(VW - 1.5, VH);
  ctx.stroke();

  // --- 3. Köşe işaretleri (sade) ---
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.strokeStyle = themeColor;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 1.6;
  const bSize = 12;
  // Sol-üst köşe
  ctx.beginPath();
  ctx.moveTo(2, bSize);
  ctx.lineTo(2, 2);
  ctx.lineTo(bSize, 2);
  ctx.stroke();
  ctx.fillRect(1, 1, 3.5, 3.5);

  // Sağ-üst köşe
  ctx.beginPath();
  ctx.moveTo(VW - bSize, 2);
  ctx.lineTo(VW - 2, 2);
  ctx.lineTo(VW - 2, bSize);
  ctx.stroke();
  ctx.fillRect(VW - 4.5, 1, 3.5, 3.5);

  // Yan duvar hassas skala işaretleri (Tech tick marks)
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  for (let ty = 60; ty < VH - 120; ty += 40) {
    ctx.beginPath();
    ctx.moveTo(2, ty);
    ctx.lineTo(6, ty);
    ctx.moveTo(VW - 6, ty);
    ctx.lineTo(VW - 2, ty);
    ctx.stroke();
  }
  ctx.restore();

  // --- 4. Duvar Darbe Parlamaları (Wall Impact Flares) ---
  if (wallFlashes.length > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    wallFlashes.forEach(wf => {
      const alpha = Math.max(0, wf.life / wf.maxLife);
      const rad = 24 * (1 - alpha * 0.4);
      const wg = ctx.createRadialGradient(wf.x, wf.y, 0, wf.x, wf.y, rad);
      wg.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
      wg.addColorStop(0.4, 'rgba(64,196,255,' + (alpha * 0.6) + ')');
      wg.addColorStop(1, 'rgba(64,196,255,0)');
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.arc(wf.x, wf.y, rad, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  if (descendMode && paddle && !paddle.exploded) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,80,80,' + (0.4 + Math.sin(globalTime * 6) * 0.15) + ')';
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, paddle.y - 8);
    ctx.lineTo(VW, paddle.y - 8);
    ctx.stroke();
    ctx.restore();
  }
}

function photoWindow(iw, ih) {
  const scale = Math.max(1, Math.min(2.8, Number(photoFit.scale) || 1));
  const winW = iw / scale;
  const winH = ih / scale;
  const maxX = Math.max(0, (iw - winW) / 2);
  const maxY = Math.max(0, (ih - winH) / 2);
  const px = Math.max(-1, Math.min(1, Number(photoFit.x) || 0));
  const py = Math.max(-1, Math.min(1, Number(photoFit.y) || 0));
  return { x: iw / 2 + px * maxX - winW / 2, y: ih / 2 + py * maxY - winH / 2, w: winW, h: winH };
}
function drawBrickPhoto(b, drawY, skipStroke) {
  if (b.tuft || tuftMode) return false;
  if (!brickPhotoOn || !brickPhotoImg || !brickPhotoImg.naturalWidth || b.col == null || b.isBoss) return false;
  const cols = Math.max(1, b.gridCols || brickCols);
  const rows = Math.max(1, b.gridRows || brickRows);
  const iw = brickPhotoImg.naturalWidth, ih = brickPhotoImg.naturalHeight;
  const win = photoWindow(iw, ih);
  ctx.drawImage(brickPhotoImg, win.x + (b.col / cols) * win.w, win.y + (b.row / rows) * win.h, win.w / cols, win.h / rows, b.x, drawY, b.w, b.h);
  if (!skipStroke) {
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x, drawY, b.w, b.h);
  }
  return true;
}

function draw() {
  ctx.save();
  const dpr = getRenderDpr();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (shake.timeLeft > 0) {
    const f = shake.timeLeft / shake.duration;
    ctx.translate((Math.random() * 2 - 1) * shake.magnitude * f, (Math.random() * 2 - 1) * shake.magnitude * f);
  }
  if (clutchSaveSlow > 0 && paddle) {
    const cScale = 1.0 + 0.04 * (clutchSaveSlow / 0.95);
    ctx.translate(VW / 2, paddle.y);
    ctx.scale(cScale, cScale);
    ctx.translate(-VW / 2, -paddle.y);
  }

  ctx.clearRect(-20, -20, VW + 40, VH + 40);
  drawArcadeBorders();
  bricks.forEach(b => {
    if (!b.alive) {
      if (b.regen && b.respawnAt) {
        const remaining = Math.max(0, b.respawnAt - globalTime);
        const prog = 1 - remaining / REGEN_RESPAWN_DELAY;
        ctx.save();
        ctx.globalAlpha = 0.22 + Math.sin(globalTime * 6) * 0.1;
        ctx.strokeStyle = '#69f0ae';
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, brickCorner(b));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#69f0ae';
        ctx.beginPath();
        ctx.roundRect(b.x, b.y + b.h - 3, b.w * Math.max(0, Math.min(1, prog)), 3, 2);
        ctx.fill();
        ctx.restore();
      }
      return;
    }
    const drawY = b.y - (b.slideOffset || 0);
    const rr = brickCorner(b);
    const j = b.jelly || 0;
    ctx.save();
    if (b.isGhost) {
      const gPhase = Math.sin(globalTime * 3.5 + (b.col || 0));
      ctx.globalAlpha = gPhase < -0.15 ? 0.24 : 0.88;
    }
    if (j > 0) {
      const cx = b.x + b.w / 2, cy = drawY + b.h / 2;
      ctx.translate(cx, cy);
      ctx.scale(1 + 0.16 * j, 1 - 0.18 * j);
      ctx.translate(-cx, -cy);
    }
    // --- Tuğla Alt Gölgesi (3D Yükselti ve Derinlik) ---
    if (!(typeof isPixelArt === 'function' && isPixelArt())) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.roundRect(b.x + 1.5, drawY + 2.5, b.w, b.h, rr);
      ctx.fill();
      ctx.restore();
    }

    if (typeof isPixelArt === 'function' && isPixelArt()) {
      drawPixelBrick(b, drawY);
      ctx.restore();
      return;
    }

    if (b.steel) {
      // --- Çelik / Ağır Çelik Tuğla (Fırçalanmış Metal & Krom Efekti) ---
      const sg = ctx.createLinearGradient(b.x, drawY, b.x, drawY + b.h);
      if (b.heavy) {
        sg.addColorStop(0, '#8d6e63');
        sg.addColorStop(0.2, '#5d4037');
        sg.addColorStop(0.5, '#3e2723');
        sg.addColorStop(0.8, '#4e342e');
        sg.addColorStop(1, '#1b0d0a');
      } else {
        sg.addColorStop(0, '#eceff1');
        sg.addColorStop(0.2, '#cfd8dc');
        sg.addColorStop(0.5, '#90a4ae');
        sg.addColorStop(0.8, '#78909c');
        sg.addColorStop(1, '#455a64');
      }
      ctx.beginPath();
      ctx.roundRect(b.x, drawY, b.w, b.h, rr);
      ctx.fillStyle = sg;
      ctx.fill();

      // Metalik üst yansıma şeridi
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(b.x + 2, drawY + 2, b.w - 4, Math.max(3, b.h * 0.35), Math.max(2, rr - 1));
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fill();
      ctx.restore();

      // Çelik kenar çerçevesi
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 3D Metalik Perçinler
      [0.18, 0.82].forEach(fx => {
        const rx = b.x + b.w * fx;
        const ry = drawY + b.h / 2;
        // Perçin gölgesi
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.arc(rx, ry + 0.8, 2.5, 0, Math.PI * 2);
        ctx.fill();
        // Perçin gövdesi
        ctx.fillStyle = b.heavy ? '#ffab91' : '#b0bec5';
        ctx.beginPath();
        ctx.arc(rx, ry, 2.2, 0, Math.PI * 2);
        ctx.fill();
        // Perçin parlaması
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(rx - 0.7, ry - 0.7, 0.9, 0, Math.PI * 2);
        ctx.fill();
      });
    } else {
      // --- Standart / Temalı Tuğlalar (Canlı & Kristal 3D Render) ---
      const st = b.style || (currentTheme && currentTheme.style) || '';
      const flick = (st === 'magma' || st === 'neon') ? (0.85 + Math.sin(globalTime * 7 + b.x * 0.04) * 0.15) : 1;
      ctx.globalAlpha = flick;
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(b.x, drawY, b.w, b.h, rr);
      ctx.clip();
      const usedPhoto = drawBrickPhoto(b, drawY, true);
      if (!usedPhoto) {
        // Soft 3D blok
        const g = ctx.createLinearGradient(b.x, drawY, b.x, drawY + b.h);
        g.addColorStop(0, mixHex(b.color, 0.28));
        g.addColorStop(0.45, b.color);
        g.addColorStop(1, mixHex(b.color, -0.32));
        ctx.fillStyle = g;
        ctx.fillRect(b.x, drawY, b.w, b.h);

        // Üst soft highlight (az gloss)
        const hl = ctx.createLinearGradient(b.x, drawY, b.x, drawY + b.h * 0.4);
        hl.addColorStop(0, 'rgba(255,255,255,0.22)');
        hl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hl;
        ctx.fillRect(b.x, drawY, b.w, b.h * 0.4);

        // Alt soft gölge
        const sh = ctx.createLinearGradient(b.x, drawY + b.h * 0.65, b.x, drawY + b.h);
        sh.addColorStop(0, 'rgba(0,0,0,0)');
        sh.addColorStop(1, 'rgba(0,0,0,0.22)');
        ctx.fillStyle = sh;
        ctx.fillRect(b.x, drawY + b.h * 0.65, b.w, b.h * 0.35);

        if (b.tuft && !b.filled) {
          const open = tuftCellOpen(b);
          ctx.fillStyle = open ? '#1a1520' : '#0c0a10';
          ctx.fillRect(b.x, drawY, b.w, b.h);
          if (open) {
            ctx.strokeStyle = b.yarn || '#c62828';
            ctx.globalAlpha = 0.85;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.roundRect(b.x + 3, drawY + 3, b.w - 6, b.h - 6, Math.max(3, rr - 2));
            ctx.stroke();
            ctx.globalAlpha = 1;
          } else {
            ctx.globalAlpha = 0.25;
            ctx.fillStyle = '#2a2430';
            ctx.fillRect(b.x + 4, drawY + 4, b.w - 8, b.h - 8);
            ctx.globalAlpha = 1;
          }
        } else if (st === 'ice') {
          // Buz kristali detayları
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.fillRect(b.x + 2, drawY + 2, b.w * 0.48, 3.5);
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.6, drawY + 2);
          ctx.lineTo(b.x + b.w * 0.75, drawY + b.h * 0.55);
          ctx.stroke();
        } else if (st === 'magma') {
          // Lav çatlak parıltısı
          const mg = ctx.createLinearGradient(b.x, drawY, b.x + b.w, drawY + b.h);
          mg.addColorStop(0, 'rgba(255,230,90,0.6)');
          mg.addColorStop(0.5, 'rgba(255,87,34,0.3)');
          mg.addColorStop(1, 'rgba(255,215,0,0.45)');
          ctx.fillStyle = mg;
          ctx.fillRect(b.x + b.w * 0.15, drawY + 2, Math.max(4, b.w * 0.16), b.h - 4);
        } else if (st === 'ocean') {
          // Dalga parıltısı
          ctx.fillStyle = 'rgba(255,255,255,0.32)';
          ctx.fillRect(b.x, drawY + b.h * (0.35 + Math.sin(globalTime * 2.2 + b.x * 0.05) * 0.2), b.w, 3);
        } else if (st === 'forest') {
          ctx.fillStyle = 'rgba(20,70,25,0.35)';
          ctx.fillRect(b.x, drawY, b.w, 5);
        } else if (st === 'storm') {
          ctx.strokeStyle = 'rgba(255,255,210,0.65)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.25, drawY);
          ctx.lineTo(b.x + b.w * 0.45, drawY + b.h * 0.55);
          ctx.lineTo(b.x + b.w * 0.4, drawY + b.h * 0.55);
          ctx.lineTo(b.x + b.w * 0.6, drawY + b.h);
          ctx.stroke();
        } else if (st === 'candy') {
          ctx.fillStyle = 'rgba(255,255,255,0.65)';
          ctx.beginPath();
          ctx.arc(b.x + b.w * 0.28, drawY + b.h * 0.42, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(b.x + b.w * 0.72, drawY + b.h * 0.58, 2.3, 0, Math.PI * 2);
          ctx.fill();
        }

        // --- Hasar / Çatlak Görünümü (Damage Cracks) ---
        if (b.hp < b.maxHp) {
          const dmgRatio = 1 - b.hp / b.maxHp;
          ctx.fillStyle = `rgba(0,0,0,${dmgRatio * 0.42})`;
          ctx.fillRect(b.x, drawY, b.w, b.h);
          // Çatlak çizgileri
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.3, drawY + 2);
          ctx.lineTo(b.x + b.w * 0.5, drawY + b.h * 0.6);
          ctx.lineTo(b.x + b.w * 0.7, drawY + b.h - 2);
          ctx.stroke();
        }
      } else if (b.hp < b.maxHp) {
        ctx.fillStyle = `rgba(0,0,0,${(1 - b.hp / b.maxHp) * 0.45})`;
        ctx.fillRect(b.x, drawY, b.w, b.h);
      }
      ctx.restore();
      ctx.globalAlpha = 1;

      // Çerçeve Kenar Çizimi (Neon Glow & 3D Bevel Edge)
      ctx.beginPath();
      ctx.roundRect(b.x, drawY, b.w, b.h, rr);
      if (!(b.tuft && !b.filled)) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = st === 'neon' ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2.4;
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1.1;
        ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      if (b.goldCrate) {
        ctx.save();
        ctx.strokeStyle = '#ffd740';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#ffab00';
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.restore();
      }
      if (b.isBoss) {
        ctx.save();
        ctx.strokeStyle = '#fff59d';
        ctx.lineWidth = 2.8;
        ctx.shadowColor = '#ffd54f';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.font = '900 13px -apple-system, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('BOSS  ' + Math.max(0, b.hp), b.x + b.w / 2, drawY + b.h / 2);
        ctx.shadowBlur = 0;
      }
    }
    if (effects.lockTargetBrick === b) {
      ctx.strokeStyle = '#ffab00';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(b.x - 2, drawY - 2, b.w + 4, b.h + 4, rr + 2);
      ctx.stroke();
    }
    if (b.isMover) {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.setLineDash([3, 2]);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(b.x + 1, drawY + 1, b.w - 2, b.h - 2, Math.max(3, rr - 2));
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (b.regen) {
      ctx.fillStyle = '#69f0ae';
      ctx.beginPath();
      ctx.arc(b.x + b.w - 6, drawY + 6, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // ❄️ Buz Tuğlası Göstergesi
    if (b.isIce) {
      ctx.save();
      ctx.strokeStyle = '#80deea';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.roundRect(b.x, drawY, b.w, b.h, rr);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#e0f7fa';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('❄️', b.x + b.w / 2, drawY + b.h / 2 + 3.5);
    }
    // ⚡ Tesla Tuğlası Göstergesi
    if (b.isTesla) {
      ctx.save();
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#ffeb3b';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.roundRect(b.x, drawY, b.w, b.h, rr);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#fff9c4';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡', b.x + b.w / 2, drawY + b.h / 2 + 3.5);
    }
    // 👻 Hayalet Tuğlası Göstergesi
    if (b.isGhost) {
      ctx.save();
      ctx.strokeStyle = '#b388ff';
      ctx.lineWidth = 1.6;
      ctx.shadowColor = '#7c4dff';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.roundRect(b.x, drawY, b.w, b.h, rr);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#ede7f6';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('👻', b.x + b.w / 2, drawY + b.h / 2 + 3.5);
    }
    // 🎯 Zayıf Nokta Hedefi (Weakpoint Bullseye)
    if (b.weakpoint && b.hp > 1) {
      const wx = b.x + b.w * (b.weakpoint.xFrac || 0.5);
      const wy = drawY + b.h * (b.weakpoint.yFrac || 0.5);
      ctx.save();
      const wPulse = Math.sin(globalTime * 8) * 1.5;
      ctx.strokeStyle = '#ff1744';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(wx, wy, 5 + wPulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#ff1744';
      ctx.beginPath();
      ctx.arc(wx, wy, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (b.spawnFlash > 0) {
      ctx.globalAlpha = b.spawnFlash;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(b.x, drawY, b.w, b.h, rr);
      ctx.fill();
    }
    ctx.restore();
  });
  resetPlayDraw();

  drawGravityWells();
  drawVortex();
  const currentBoss = bricks && bricks.find(b => b.alive && b.isBoss);
  if (currentBoss) drawBossShields(currentBoss);
  drawBossMines();
  drawUfo();
  drawCompanionDrone();
  drawChronoVignette();
  drawBumpers();
  drawAimGuide();

  if (obstacle && remainingBreakable() > ENDGAME_BRICKS) {
    ctx.beginPath();
    ctx.roundRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h, 6);
    ctx.fillStyle = '#b71c1c';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,180,0.45)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let sx = 6; sx < obstacle.w; sx += 12) {
      ctx.fillRect(obstacle.x + sx, obstacle.y + 2, 4, obstacle.h - 4);
    }
  }

  // --- Power-up Dropları (3D Neon Kapsüller) ---
  drops.forEach(d => {
    const def = POWERUPS[d.type];
    const mainColor = d.tint || (def && def.color) || '#42a5f5';

    // Alt gölge
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.roundRect(d.x + 1, d.y + 2.5, d.w, d.h, 10);
    ctx.fill();

    // Dış Geniş Işıma Halesi (Radiant Beacon Halo)
    const glowPulse = 0.5 + 0.35 * Math.sin(globalTime * 8);
    ctx.globalCompositeOperation = 'lighter';
    const haloGrad = ctx.createRadialGradient(d.x + d.w / 2, d.y + d.h / 2, 2, d.x + d.w / 2, d.y + d.h / 2, d.w * 1.4);
    haloGrad.addColorStop(0, mainColor);
    haloGrad.addColorStop(0.5, mainColor);
    haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = glowPulse * 0.45;
    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(d.x + d.w / 2, d.y + d.h / 2, d.w * 1.4, 0, Math.PI * 2);
    ctx.fill();

    // Dış Neon Çerçeve Işıması
    ctx.strokeStyle = mainColor;
    ctx.globalAlpha = glowPulse;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(d.x - 1, d.y - 1, d.w + 2, d.h + 2, 11);
    ctx.stroke();

    // Gövde 3D Radyal/Lineer Gradyan
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const dg = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.h);
    dg.addColorStop(0, mixHex(mainColor, 0.45));
    dg.addColorStop(0.4, mainColor);
    dg.addColorStop(1, mixHex(mainColor, -0.4));
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.roundRect(d.x, d.y, d.w, d.h, 9);
    ctx.fill();

    // Üst Kristal Parlama (Glass Highlight)
    const cap = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.h * 0.45);
    cap.addColorStop(0, 'rgba(255,255,255,0.7)');
    cap.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.roundRect(d.x + 2, d.y + 2, d.w - 4, d.h * 0.42, 6);
    ctx.fill();

    // Çerçeve Kenarlığı
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(d.x, d.y, d.w, d.h, 9);
    ctx.stroke();

    // İkon
    drawPowerIcon(d.type, d.x + d.w / 2, d.y + d.h / 2 + 1, 11);
    ctx.restore();
  });

  // --- Lazer Işınları (Beyaz Çekirdekli Neon Plazma) ---
  ctx.save();
  lasers.forEach(l => {
    // Dış Neon Işıma
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(l.x - 2, 0, l.x + l.w + 2, 0);
    lg.addColorStop(0, 'rgba(255,215,64,0)');
    lg.addColorStop(0.25, 'rgba(255,215,64,0.75)');
    lg.addColorStop(0.5, '#ffffff');
    lg.addColorStop(0.75, 'rgba(255,215,64,0.75)');
    lg.addColorStop(1, 'rgba(255,215,64,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(l.x - 2, l.y, l.w + 4, l.h);

    // Beyaz Yoğun Enerji Çekirdeği
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(l.x + 1, l.y, Math.max(1, l.w - 2), l.h);
  });
  ctx.restore();

  // --- Roketler (İtki Alevli ve Metalik Başlıklı Füzeler) ---
  ctx.save();
  rockets.forEach(r => {
    // Roket İtki Ateşi (Arkadan çıkan alev)
    const flameH = 8 + Math.random() * 5;
    const fg = ctx.createLinearGradient(r.x, r.y + r.h, r.x, r.y + r.h + flameH);
    fg.addColorStop(0, '#ffffff');
    fg.addColorStop(0.3, '#ffeb3b');
    fg.addColorStop(0.7, '#ff5722');
    fg.addColorStop(1, 'rgba(255,87,34,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(r.x + 1, r.y + r.h);
    ctx.lineTo(r.x + r.w / 2, r.y + r.h + flameH);
    ctx.lineTo(r.x + r.w - 1, r.y + r.h);
    ctx.closePath();
    ctx.fill();

    // Roket Gövdesi (Metalik)
    const rg = ctx.createLinearGradient(r.x, r.y, r.x + r.w, r.y);
    rg.addColorStop(0, '#cfd8dc');
    rg.addColorStop(0.5, '#ffffff');
    rg.addColorStop(1, '#90a4ae');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y + 3, r.w, r.h - 3, 2);
    ctx.fill();

    // Roket Burun Ucu (Kırmızı Koni)
    ctx.fillStyle = '#f44336';
    ctx.beginPath();
    ctx.moveTo(r.x, r.y + 3);
    ctx.lineTo(r.x + r.w / 2, r.y);
    ctx.lineTo(r.x + r.w, r.y + 3);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();

  if (effects.net > 0) {
    const zh = netZoneH();
    ctx.save();
    ctx.globalAlpha = 0.16 + Math.sin(globalTime * 5) * 0.05;
    ctx.fillStyle = '#8bc34a';
    ctx.fillRect(0, paddle.y - zh, VW, zh);
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#c5e1a5';
    ctx.lineWidth = 1;
    for (let gx = 0; gx < VW; gx += 14) {
      ctx.beginPath();
      ctx.moveTo(gx, paddle.y - zh);
      ctx.lineTo(gx, paddle.y);
      ctx.stroke();
    }
    for (let gy = paddle.y - zh; gy < paddle.y; gy += 14) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(VW, gy);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (effects.sticky > 0 && paddle) {
    const reach = stickyReach();
    const rank = effectRank('sticky');
    ctx.save();
    ctx.globalAlpha = rank >= 2 ? 0.16 : 0.09;
    ctx.fillStyle = '#b388ff';
    ctx.beginPath();
    ctx.arc(paddle.x + paddle.w / 2, paddle.y, reach, Math.PI, 0, true);
    ctx.lineTo(paddle.x + paddle.w / 2, paddle.y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  if (effects.shieldCharges > 0) {
    ctx.fillStyle = 'rgba(38,198,218,0.6)';
    ctx.fillRect(0, VH - 4, VW, 4);
  }

  resetPlayDraw();
  const skin = SKINS.find(s => s.id === selectedSkin) || SKINS[0];
  const skinRgb = (typeof hexToRgb === 'function' && hexToRgb(skin.main)) || { r: 255, g: 255, b: 255 };
  balls.forEach((ball, idx) => {
    if (!ball || ball.dead) return;
    const load = (ball.overload || 0);
    const coreR = Math.max(7, ball.r || 8.5);
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = (skin && skin.main) || '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, coreR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111318';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    try {
    const extra = !!(ball.isMirror || idx > 0);
    const isPlasma = (ball.plasmaCharge > 0);
    const isPiercingVisual = isPlasma || effects.fireball > 0 || effects.pierceCharges > 0 || load >= MAX_OVERLOAD || feverTimer > 0;
    const ballTint = isPlasma ? [0, 229, 255] : (effects.fireball > 0 || feverTimer > 0 ? [255,112,67] : (load > 0 ? [255, 120 + load * 18, 60] : (effects.pierceCharges > 0 ? [0,229,255] : (ball.isMirror ? [244,143,177] : [skinRgb.r,skinRgb.g,skinRgb.b]))));
    const trailBase = extra ? 0.6 : 0.42;
    const spec = trailSpec();
    const tlen = Math.max(1, ball.trail.length);

    if (typeof isPixelArt === 'function' && isPixelArt()) {
      const r = Math.max(3, Math.round(ball.r));
      const bx = Math.round(ball.x), by = Math.round(ball.y);
      ctx.save();
      for (let i = 0; i < ball.trail.length; i += 2) {
        const p = ball.trail[i];
        const a = (1 - i / tlen) * 0.55;
        const s = Math.max(2, Math.round(r * (1 - i / tlen * 0.5)));
        ctx.fillStyle = `rgba(${ballTint[0]},${ballTint[1]},${ballTint[2]},${a})`;
        ctx.fillRect(Math.round(p.x) - s, Math.round(p.y) - s, s * 2, s * 2);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(bx - r + 1, by - r + 2, r * 2, r * 2);
      ctx.fillStyle = skin.dark || `rgb(${(ballTint[0]*0.35)|0},${(ballTint[1]*0.35)|0},${(ballTint[2]*0.35)|0})`;
      ctx.fillRect(bx - r, by - r, r * 2, r * 2);
      ctx.fillStyle = skin.main || `rgb(${ballTint[0]},${ballTint[1]},${ballTint[2]})`;
      ctx.fillRect(bx - r, by - r, r * 2 - 2, r * 2 - 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx - r + 1, by - r + 1, Math.max(2, Math.floor(r * 0.7)), Math.max(2, Math.floor(r * 0.55)));
      ctx.restore();
      return;
    }

    // --- 1. Top Kuyruk / Trail Render (Glowlu & Yumuşak) ---
    ctx.save();
    ctx.globalCompositeOperation = spec.style === 'smoke' ? 'source-over' : 'lighter';
    for (let i = 0; i < ball.trail.length; i++) {
      if (spec.skip > 1 && i % spec.skip && i !== ball.trail.length - 1) continue;
      const p = ball.trail[i];
      const frac = i / tlen;
      const a = (1 - frac) * trailBase;
      const rr = Math.max(1.5, ball.r * (1 - frac * 0.42));
      if (spec.style === 'rainbow') {
        const hue = (i * 22 + globalTime * 80) % 360;
        ctx.fillStyle = 'hsla(' + hue + ',95%,65%,' + a + ')';
      } else if (spec.style === 'spark') {
        // Altın kıvılcım & ateş dökülmesi
        const sparkPulse = (Math.sin(globalTime * 15 + i) + 1) * 0.5;
        ctx.fillStyle = i % 2 ? `rgba(255,235,59,${a * 0.95})` : `rgba(255,109,0,${a * 0.8})`;
      } else if (spec.style === 'smoke') {
        ctx.fillStyle = `rgba(180,195,215,${a * 0.6})`;
      } else if (spec.id === 'tflame') {
        // Ateş / Plazma Kuyruk
        const fFrac = i / tlen;
        const col = fFrac > 0.6 ? `rgba(255,61,0,${a})` : (fFrac > 0.3 ? `rgba(255,145,0,${a})` : `rgba(255,255,141,${a})`);
        ctx.fillStyle = col;
      } else {
        ctx.fillStyle = `rgba(${ballTint[0]},${ballTint[1]},${ballTint[2]},${a})`;
      }
      ctx.beginPath();
      const sparkRadius = (spec.style === 'spark' || spec.id === 'tflame') ? rr * (i % 3 === 0 ? 0.6 : 1.1) : rr;
      ctx.arc(p.x, p.y, sparkRadius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const r = ball.r * (1 + Math.min(0.35, (ball.overload || 0) * 0.08));

    // --- 2. Dış Enerji / Yangın Aurası (Ateş Topu / Piercing / Fever) ---
    if (isPiercingVisual) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const fireGrad = ctx.createRadialGradient(ball.x, ball.y, r * 0.6, ball.x, ball.y, r * 2.1);
      const glowR = ballTint[0], glowG = ballTint[1], glowB = ballTint[2];
      fireGrad.addColorStop(0, `rgba(${glowR},${glowG},${glowB},0.6)`);
      fireGrad.addColorStop(0.5, `rgba(${glowR},${glowG},${glowB},0.22)`);
      fireGrad.addColorStop(1, `rgba(${glowR},${glowG},${glowB},0)`);
      ctx.fillStyle = fireGrad;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, r * 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // --- 3. Topun Alt Yumuşak Gölgesi ---
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y + r * 0.28, r * 0.92, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // --- 4. Soft küresel gövde ---
    ctx.save();
    const ballSpd = Math.hypot(ball.vx || 0, ball.vy || 0);
    if (ballSpd > 160 && !ball.stuck) {
      const moveAng = Math.atan2(ball.vy, ball.vx);
      const stretch = Math.min(0.08, (ballSpd / 780) * 0.08);
      ctx.translate(ball.x, ball.y);
      ctx.rotate(moveAng);
      ctx.scale(1 + stretch, 1 - stretch * 0.45);
      ctx.rotate(-moveAng);
      ctx.translate(-ball.x, -ball.y);
    }
    if (skin.look === 'ghost') ctx.globalAlpha = 0.68;

    const lx = ball.x - r * 0.28;
    const ly = ball.y - r * 0.32;
    const g = ctx.createRadialGradient(lx, ly, r * 0.08, ball.x, ball.y, r * 1.02);

    const topCol = isPiercingVisual || ball.isMirror ? `rgb(${Math.min(255, ballTint[0] + 70)},${Math.min(255, ballTint[1] + 70)},${Math.min(255, ballTint[2] + 70)})` : mixHex(skin.main, 0.35);
    const midCol = isPiercingVisual || ball.isMirror ? `rgb(${ballTint[0]},${ballTint[1]},${ballTint[2]})` : skin.main;
    const darkCol = isPiercingVisual || ball.isMirror ? `rgb(${(ballTint[0] * 0.35) | 0},${(ballTint[1] * 0.35) | 0},${(ballTint[2] * 0.35) | 0})` : (skin.dark || '#37474f');

    g.addColorStop(0, 'rgba(255,255,255,0.72)');
    g.addColorStop(0.28, topCol);
    g.addColorStop(0.7, midCol);
    g.addColorStop(1.0, darkCol);

    if (skin.look === 'pixel' && !isPiercingVisual && !ball.isMirror) {
      ctx.fillStyle = skin.main;
      const s = r * 1.6;
      ctx.fillRect(ball.x - s / 2, ball.y - s / 2, s, s);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(ball.x - s / 2 + 1, ball.y - s / 2 + 1, s * 0.45, s * 0.45);
      ctx.strokeStyle = skin.dark || '#1b5e20';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(ball.x - s / 2, ball.y - s / 2, s, s);
    } else {
      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Dış ince kristal kenarlık
      ctx.strokeStyle = isPiercingVisual ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 1;
      ctx.stroke();

      if ((ball.overload || 0) >= MAX_OVERLOAD) {
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 2.4;
        ctx.shadowColor = '#ffb300';
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;

    // --- 5. Özel Kaplama Detayları (Skins) ---
    if (skin.look === 'eight' && !isPiercingVisual) {
      ctx.beginPath();
      ctx.fillStyle = '#ffffff';
      ctx.arc(ball.x, ball.y - r * 0.06, r * 0.44, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.font = '900 ' + Math.round(r * 0.88) + 'px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('8', ball.x, ball.y - r * 0.04);
    } else if (skin.look === 'tiger' && !isPiercingVisual) {
      ctx.strokeStyle = 'rgba(20,10,0,0.7)';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(ball.x - r * 0.15, ball.y, r * 0.68, 0.35, 2.25);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ball.x + r * 0.1, ball.y + r * 0.06, r * 0.52, 3.15, 5.05);
      ctx.stroke();
    } else if (skin.look === 'glass') {
      // Cam küre: iç çift parlama ve ışık kırılması
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, r - 1, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(ball.x + r * 0.15, ball.y + r * 0.18, r * 0.58, 0.4, 2.6);
      ctx.stroke();
      ctx.restore();
    } else if (skin.look === 'heart' && !isPiercingVisual) {
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath();
      const hx = ball.x, hy = ball.y - r * 0.08, hs = r * 0.3;
      ctx.moveTo(hx, hy + hs * 0.3);
      ctx.bezierCurveTo(hx, hy - hs * 0.2, hx - hs, hy - hs * 0.2, hx - hs, hy + hs * 0.15);
      ctx.bezierCurveTo(hx - hs, hy + hs * 0.55, hx, hy + hs * 0.85, hx, hy + hs);
      ctx.bezierCurveTo(hx, hy + hs * 0.85, hx + hs, hy + hs * 0.55, hx + hs, hy + hs * 0.15);
      ctx.bezierCurveTo(hx + hs, hy - hs * 0.2, hx, hy - hs * 0.2, hx, hy + hs * 0.3);
      ctx.fill();
    }

    // --- 6. İkili Specular Highlight (Cam / Metalik Parlama) ---
    if (skin.look !== 'pixel') {
      // Ana büyük highlight
      const hx = ball.x - r * 0.32;
      const hy = ball.y - r * 0.34;
      const hlGrad = ctx.createRadialGradient(hx, hy, 0, hx, hy, r * 0.38);
      hlGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
      hlGrad.addColorStop(0.5, 'rgba(255,255,255,0.55)');
      hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hlGrad;
      ctx.beginPath();
      ctx.arc(hx, hy, r * 0.38, 0, Math.PI * 2);
      ctx.fill();

      // Sekonder mikro parlama (alt yansıma)
      const rx = ball.x + r * 0.28;
      const ry = ball.y + r * 0.3;
      const secGrad = ctx.createRadialGradient(rx, ry, 0, rx, ry, r * 0.22);
      secGrad.addColorStop(0, 'rgba(255,255,255,0.4)');
      secGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = secGrad;
      ctx.beginPath();
      ctx.arc(rx, ry, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    // --- 7. Soft aura (tek halka) ---
    if (skin.aura && !isPiercingVisual) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      const pulse = 0.35 + Math.sin(globalTime * 4 + idx) * 0.12;
      ctx.strokeStyle = skin.glow || skin.main;
      ctx.globalAlpha = pulse;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, r + 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    } catch (e) { resetPlayDraw(); }
  });

  resetPlayDraw();
  if (paddle && !paddle.exploded) {
    ctx.save();
    if (effects && effects.invis > 0) ctx.globalAlpha = 0.42;
    const squashT = Math.pow(Math.max(0, paddle.squashTimer / SQUASH_DURATION), 0.62);
    const scaleX = 1 + 0.26 * squashT;
    const scaleY = 1 - 0.18 * squashT;
    const pcx = paddle.x + paddle.w / 2, pcy = paddle.y + paddle.h / 2;
    ctx.translate(pcx, pcy);
    ctx.scale(scaleX, scaleY);
    ctx.translate(-pcx, -pcy);

    const pskin = PADDLE_SKINS.find(s => s.id === selectedPaddle) || PADDLE_SKINS[0];
    const plook = pskin.look;
    const pCorner = plook === 'wave' ? 16 : (plook === 'twin' ? 10 : 12);

    if (typeof isPixelArt === 'function' && isPixelArt()) {
      const px = Math.round(paddle.x), py = Math.round(paddle.y);
      const pw = Math.round(paddle.w), ph = Math.max(8, Math.round(paddle.h));
      const step = Math.max(3, Math.floor(ph / 3));
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(px + 1, py + 2, pw, ph);
      ctx.fillStyle = mixHex(pskin.c2, -0.25);
      ctx.fillRect(px, py, pw, ph);
      ctx.fillStyle = pskin.c1;
      ctx.fillRect(px, py, pw, ph - step);
      ctx.fillStyle = mixHex(pskin.c1, 0.35);
      ctx.fillRect(px, py, pw, step);
      ctx.fillStyle = mixHex(pskin.c1, 0.15);
      ctx.fillRect(px, py, step, ph - step);
      ctx.restore();
    } else {

    // --- 1. Raket Alt Gölgesi (3D Yükselti Derinliği) ---
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.36)';
    ctx.beginPath();
    if (plook === 'twin') {
      const gap = 4, hw = (paddle.w - gap) / 2;
      ctx.roundRect(paddle.x, paddle.y + 3.5, hw, paddle.h, 10);
      ctx.roundRect(paddle.x + hw + gap, paddle.y + 3.5, hw, paddle.h, 10);
    } else if (plook === 'pixel') {
      ctx.fillRect(paddle.x, paddle.y + 3, paddle.w, paddle.h);
    } else {
      ctx.roundRect(paddle.x, paddle.y + 3.5, paddle.w, paddle.h, pCorner);
    }
    ctx.fill();
    ctx.restore();

    // --- 2. Raket Gövdesi 4-Stop Zengin Gradyan ---
    const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    if (effects.shrink > 0) {
      grad.addColorStop(0, '#ffcdd2');
      grad.addColorStop(0.3, '#ff8a80');
      grad.addColorStop(0.7, '#e53935');
      grad.addColorStop(1, '#b71c1c');
    } else {
      grad.addColorStop(0, mixHex(pskin.c1, 0.45));
      grad.addColorStop(0.35, pskin.c1);
      grad.addColorStop(0.75, pskin.c2);
      grad.addColorStop(1, mixHex(pskin.c2, -0.38));
    }
    ctx.fillStyle = grad;

    if (plook === 'twin') {
      const gap = 4, hw = (paddle.w - gap) / 2;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, hw, paddle.h, 10);
      ctx.roundRect(paddle.x + hw + gap, paddle.y, hw, paddle.h, 10);
      ctx.fill();
    } else if (plook === 'pixel') {
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    } else if (plook === 'bat') {
      ctx.beginPath();
      ctx.moveTo(paddle.x - 6, paddle.y + paddle.h * 0.15);
      ctx.lineTo(paddle.x + 12, paddle.y);
      ctx.lineTo(paddle.x + paddle.w - 12, paddle.y);
      ctx.lineTo(paddle.x + paddle.w + 6, paddle.y + paddle.h * 0.15);
      ctx.lineTo(paddle.x + paddle.w, paddle.y + paddle.h);
      ctx.lineTo(paddle.x, paddle.y + paddle.h);
      ctx.closePath();
      ctx.fill();
    } else if (plook === 'shield') {
      ctx.beginPath();
      ctx.moveTo(paddle.x + 6, paddle.y + paddle.h);
      ctx.lineTo(paddle.x, paddle.y + 5);
      ctx.quadraticCurveTo(pcx, paddle.y - 7, paddle.x + paddle.w, paddle.y + 5);
      ctx.lineTo(paddle.x + paddle.w - 6, paddle.y + paddle.h);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, pCorner);
      ctx.fill();
    }

    // Dalga efekti
    if (plook === 'wave') {
      ctx.fillStyle = 'rgba(255,255,255,0.32)';
      ctx.beginPath();
      ctx.moveTo(paddle.x + 4, paddle.y + paddle.h * 0.45);
      ctx.quadraticCurveTo(pcx, paddle.y - 2, paddle.x + paddle.w - 4, paddle.y + paddle.h * 0.45);
      ctx.lineTo(paddle.x + paddle.w - 4, paddle.y + 5);
      ctx.quadraticCurveTo(pcx, paddle.y + 8, paddle.x + 4, paddle.y + 5);
      ctx.fill();
    }

    // --- 3. Dış çerçeve (mat, glow yok) ---
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    if (plook === 'twin') {
      const gap = 4, hw = (paddle.w - gap) / 2;
      ctx.roundRect(paddle.x, paddle.y, hw, paddle.h, 10);
      ctx.roundRect(paddle.x + hw + gap, paddle.y, hw, paddle.h, 10);
    } else if (plook !== 'pixel') {
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, pCorner);
    }
    ctx.stroke();

    // --- 4. Üst soft highlight (mat yüzey) ---
    ctx.save();
    const pGloss = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + 6);
    pGloss.addColorStop(0, 'rgba(255,255,255,0.22)');
    pGloss.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = pGloss;
    ctx.beginPath();
    ctx.roundRect(paddle.x + 5, paddle.y + 2, paddle.w - 10, Math.min(5, paddle.h * 0.3), 4);
    ctx.fill();
    ctx.restore();

    // --- 4.b Raket Vuruş Nabzı (Kinetic Ripple Flare) ---
    if (paddleHitPulse.time > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const ripAlpha = paddleHitPulse.time / 0.22;
      const ripW = (1 - ripAlpha) * paddle.w * 0.85;
      const hx = paddle.x + Math.max(8, Math.min(paddle.w - 8, paddleHitPulse.x));
      const rg = ctx.createLinearGradient(hx - ripW, paddle.y, hx + ripW, paddle.y);
      rg.addColorStop(0, 'rgba(255,255,255,0)');
      rg.addColorStop(0.5, 'rgba(255,255,255,' + (ripAlpha * 0.9) + ')');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(Math.max(paddle.x, hx - ripW), paddle.y, Math.min(paddle.w, ripW * 2), paddle.h);
      ctx.restore();
    }

    // --- 5. Merkez Nişan Üçgeni ---
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.moveTo(pcx - 7, paddle.y - 8);
    ctx.lineTo(pcx + 7, paddle.y - 8);
    ctx.lineTo(pcx, paddle.y - 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(pcx - 7, paddle.y - 9.5);
    ctx.lineTo(pcx + 7, paddle.y - 9.5);
    ctx.lineTo(pcx, paddle.y - 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Prestij Altın Aurası
    if (prestigeCount > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,215,64,' + (0.45 + 0.3 * Math.sin(globalTime * 4.2)) + ')';
      ctx.lineWidth = 2.4;
      ctx.shadowColor = '#ffd740';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(paddle.x - 2, paddle.y - 2, paddle.w + 4, paddle.h + 4, pCorner + 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    }
  }

  if (typeof lastLifeTension === 'function' && lastLifeTension()) {
    ctx.fillStyle = 'rgba(255,72,18,' + (0.05 + 0.03 * Math.sin(globalTime * 6.4)) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  if (paddle && !paddle.exploded && balls) {
    let near = false;
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      if (!b || b.dead || b.stuck) continue;
      if (b.vy > 0 && b.y > paddle.y - 90 && b.y < paddle.y + 8) { near = true; break; }
    }
    if (near && !(typeof isPixelArt === 'function' && isPixelArt())) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.18 + 0.08 * Math.sin(globalTime * 14);
      ctx.strokeStyle = '#fff3c4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(paddle.x - 4, paddle.y - 4, paddle.w + 8, paddle.h + 8, 14);
      ctx.stroke();
      ctx.restore();
    }
  }

  // --- Partiküller (Dairesel Parlayan Kıvılcımlar & Kristal Parçacıklar) ---
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  particles.forEach(p => {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    if (p.shard && p.rot) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      // Yuvarlatılmış döner kristal parça
      ctx.beginPath();
      ctx.roundRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.75, 1.5);
      ctx.fill();
      // İç parlama noktası
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(-p.size * 0.25, -p.size * 0.25, p.size * 0.5, p.size * 0.35);
      ctx.restore();
    } else {
      // Dairesel kıvılcım & ışık zerresi
      const pr = Math.max(1, p.size / 2);
      ctx.beginPath();
      ctx.arc(p.x, p.y, pr, 0, Math.PI * 2);
      ctx.fill();

      // Beyaz sıcak çekirdek noktası
      ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.75) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, pr * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- Şok Dalgaları (Shockwaves / Kinetic Impact Rings) ---
  if (shockwaves.length > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    shockwaves.forEach(sw => {
      const alpha = Math.max(0, sw.life / sw.maxLife);
      // Dış neon halka
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = alpha * 0.85;
      ctx.lineWidth = Math.max(1, 3.2 * alpha);
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.stroke();

      // İç parlak beyaz halka
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = alpha * 0.55;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, Math.max(1, sw.r * 0.72), 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.restore();
  }

  // --- Şimşek Arkları (Chain Lightning Electric Arcs) ---
  if (lightningArcs.length > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    lightningArcs.forEach(la => {
      const alpha = Math.max(0, la.life / la.maxLife);
      const segs = 7;
      const dx = la.x2 - la.x1, dy = la.y2 - la.y1;
      const nx = -dy, ny = dx;
      const len = Math.max(1, Math.hypot(dx, dy));

      ctx.beginPath();
      ctx.moveTo(la.x1, la.y1);
      for (let s = 1; s < segs; s++) {
        const frac = s / segs;
        const jitter = Math.sin(s * 8 + la.seed) * 15 * (1 - Math.abs(frac - 0.5));
        const jx = (nx / len) * jitter;
        const jy = (ny / len) * jitter;
        ctx.lineTo(la.x1 + dx * frac + jx, la.y1 + dy * frac + jy);
      }
      ctx.lineTo(la.x2, la.y2);

      // Dış neon mavi ışıma
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 4.2 * alpha;
      ctx.globalAlpha = alpha * 0.9;
      ctx.stroke();

      // İç beyaz enerji teli
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6 * alpha;
      ctx.globalAlpha = alpha;
      ctx.stroke();
    });
    ctx.restore();
  }

  // --- Floating Text (Çift Katmanlı Konturlu Arcade Metinleri) ---
  floatingTexts.forEach(t => {
    const u = 1 - Math.max(0, t.life / t.maxLife);
    const pop = t.big ? (0.85 + 0.28 * Math.min(1, u * 6)) : (0.92 + 0.1 * Math.min(1, u * 5));
    ctx.save();
    const alpha = Math.max(0, t.life / t.maxLife);
    ctx.globalAlpha = alpha;
    ctx.translate(t.x, t.y);
    ctx.scale(pop, pop);

    const fontStr = (t.big ? '900 25px' : '800 15px') + ' -apple-system, system-ui, sans-serif';
    ctx.font = fontStr;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Kalın yumuşak gölge konturu (okunabilirlik garantisi)
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = t.big ? 4.5 : 3.2;
    ctx.lineJoin = 'round';
    ctx.strokeText(t.text, 0, 0);

    // Dış Neon Glow (Büyük metinlerde)
    if (t.big) {
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 10;
    }

    // Ana canlı renk
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, 0, 0);

    ctx.restore();
  });
  // --- 1. CANLI BOSS CAN BARI (BOSS HP BAR) ---
  const liveBoss = bricks && bricks.find(b => b.alive && b.isBoss);
  if (liveBoss) {
    ctx.save();
    const barW = Math.min(VW - 40, 260);
    const barH = 14;
    const barX = (VW - barW) / 2;
    const barY = 16;
    const hpFrac = Math.max(0, liveBoss.hp / liveBoss.maxHp);

    // Arka plan
    ctx.fillStyle = 'rgba(10,5,16,0.75)';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, 7);
    ctx.fill();

    // Dolu kısım gradyanı
    const bgG = ctx.createLinearGradient(barX, barY, barX + barW * hpFrac, barY);
    bgG.addColorStop(0, '#ff1744');
    bgG.addColorStop(0.5, '#ff5252');
    bgG.addColorStop(1, '#ff9100');
    ctx.fillStyle = bgG;
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * hpFrac, barH, 7);
    ctx.fill();

    // Çerçeve
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Yazı
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👑 BOSS ' + liveBoss.hp + '/' + liveBoss.maxHp, VW / 2, barY + barH / 2);
    ctx.restore();
  }

  // --- 2. BOSS MERMİLERİ (ENEMY BULLETS) ---
  if (bossBullets.length > 0) {
    ctx.save();
    bossBullets.forEach(bb => {
      // Dış ateş ışıması
      ctx.globalCompositeOperation = 'lighter';
      const bg = ctx.createRadialGradient(bb.x, bb.y, 0, bb.x, bb.y, bb.r * 2.2);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(0.3, '#ff5252');
      bg.addColorStop(0.8, '#d50000');
      bg.addColorStop(1, 'rgba(213,0,0,0)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(bb.x, bb.y, bb.r * 2.2, 0, Math.PI * 2);
      ctx.fill();

      // İç çekirdek
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(bb.x, bb.y, bb.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // --- 3. ULTI ENERJİ BARI & BUTONU ---
  if (paddle && !paddle.exploded) {
    ctx.save();
    const uFrac = ultiActiveTimer > 0 ? (ultiActiveTimer / 1.5) : (ultiCharge / 100);
    const uBarW = paddle.w * 0.88;
    const uBarH = 4;
    const uBarX = paddle.x + (paddle.w - uBarW) / 2;
    const uBarY = paddle.y + paddle.h + 5;

    // Arka plan
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(uBarX, uBarY, uBarW, uBarH, 2);
    ctx.fill();

    // Enerji dolumu
    if (uFrac > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const ug = ctx.createLinearGradient(uBarX, uBarY, uBarX + uBarW * uFrac, uBarY);
      if (ultiActiveTimer > 0) {
        ug.addColorStop(0, '#ffd54f');
        ug.addColorStop(1, '#ff6d00');
      } else {
        ug.addColorStop(0, '#00e5ff');
        ug.addColorStop(1, '#7c4dff');
      }
      ctx.fillStyle = ug;
      ctx.beginPath();
      ctx.roundRect(uBarX, uBarY, uBarW * uFrac, uBarH, 2);
      ctx.fill();
    }

    // ULTI Hazır Göstergesi & Buton (Sadece %100 Hazırken Çıkar)
    if (ultiCharge >= 100 && ultiActiveTimer <= 0) {
      ctx.globalCompositeOperation = 'lighter';
      const pulse = 0.75 + 0.25 * Math.sin(globalTime * 8);
      const btnW = 130, btnH = 26;
      const btnX = paddle.x + paddle.w / 2 - btnW / 2;
      const btnY = paddle.y + paddle.h + 12;

      ctx.fillStyle = 'rgba(255,213,79,' + (pulse * 0.3) + ')';
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 13);
      ctx.fill();

      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 1.8;
      ctx.shadowColor = '#ffab00';
      ctx.shadowBlur = 10;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 12px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ultiActiveTimer > 0 ? '⚡ SÜPER MOD ⚡' : '⚡ DOKUN: ULTI ⚡', btnX + btnW / 2, btnY + btnH / 2);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // --- 4. İKİLİ IŞINLANMA PORTALLARI (WORMHOLES RENDER) ---
  if (wormholes && wormholes.length === 2) {
    ctx.save();
    wormholes.forEach((w, idx) => {
      ctx.save();
      ctx.translate(w.x, w.y);
      ctx.rotate(w.angle * (idx === 0 ? 1 : -1));
      ctx.globalCompositeOperation = 'lighter';
      // Dış Girdap
      const pGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, w.r * 1.5);
      pGrad.addColorStop(0, '#ffffff');
      pGrad.addColorStop(0.4, w.color);
      pGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.arc(0, 0, w.r * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Dönen Işık Halkası
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 2.4;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, w.r, 0, Math.PI * 2);
      ctx.stroke();

      // Merkez Çekirdek
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }

  // --- 5. MATRIX CLUTCH SAVE (AĞIR ÇEKİM VIGNETTE & KALP ATIŞI EFEKTİ) ---
  if (clutchSaveSlow > 0) {
    ctx.save();
    const cPulse = (Math.sin(globalTime * 24) + 1) * 0.5;
    ctx.fillStyle = 'rgba(255, 23, 68, ' + (0.18 + cPulse * 0.16) + ')';
    ctx.fillRect(0, 0, VW, VH);
    // Kenar Vignette
    const vigGrad = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.3, VW / 2, VH / 2, VH * 0.7);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vigGrad.addColorStop(1, 'rgba(20,0,5,0.75)');
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, VW, VH);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 18px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 12;
    ctx.fillText('⚡ KURTAR! ⚡', VW / 2, paddle.y - 36);
    ctx.restore();
  }

  // --- 6. REKOR HAYALETİ & YAKALAMA BARI (GHOST HIGHSCORE) ---
  if (best > 0 && gameState === 'playing') {
    ctx.save();
    const ghostW = 4;
    const ghostH = 110;
    const ghostX = VW - 10;
    const ghostY = VH * 0.38;
    const progressFrac = Math.min(1, score / best);

    // Arka Bar
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(ghostX, ghostY, ghostW, ghostH, 2);
    ctx.fill();

    // İlerleme Doldurma
    ctx.globalCompositeOperation = 'lighter';
    const fillH = ghostH * progressFrac;
    const gGrad = ctx.createLinearGradient(ghostX, ghostY + ghostH, ghostX, ghostY + ghostH - fillH);
    gGrad.addColorStop(0, '#ffd54f');
    gGrad.addColorStop(1, '#ff1744');
    ctx.fillStyle = gGrad;
    ctx.beginPath();
    ctx.roundRect(ghostX, ghostY + ghostH - fillH, ghostW, fillH, 2);
    ctx.fill();

    // Taç İkonu / Gösterge
    const crownY = ghostY + ghostH - fillH;
    ctx.fillStyle = progressFrac >= 1 ? '#ffea00' : 'rgba(255,213,79,0.7)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('👑', ghostX - 3, crownY + 4);

    // Rekor Yaklaşma Uyarısı
    if (progressFrac >= 0.9 && progressFrac < 1 && !ghostAnnounced) {
      ghostAnnounced = true;
      announceEvent('REKORA AZ KALDI!', '#ffd54f', 'normal');
      spawnFloatingText(VW / 2, VH * 0.3, '🔥 REKORU GEÇMEK ÜZERESİN! 🔥', '#ffd54f', true);
    }
    ctx.restore();
  }

  // --- 7. ARCADE ANNOUNCER DEV BAŞLIK ---
  if (announcerTimer > 0 && announcerText) {
    ctx.save();
    const aFrac = announcerTimer / 1.4;
    const aScale = aFrac > 0.8 ? (1 + (1 - aFrac) * 1.5) : 1;
    ctx.globalAlpha = Math.min(1, announcerTimer * 2.2);
    ctx.translate(VW / 2, VH * 0.22);
    ctx.scale(aScale, aScale);
    ctx.fillStyle = announcerColor;
    ctx.font = '900 22px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = announcerColor;
    ctx.shadowBlur = 16;
    ctx.fillText(announcerText, 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

let lastTimestamp = 0;
function frame(ts) {
  if (!lastTimestamp) lastTimestamp = ts;
  let dt = (ts - lastTimestamp) / 1000;
  lastTimestamp = ts;
  dt = Math.min(dt, 0.033);
  try {
    update(dt);
    const drawing = gameState === 'playing' || gameState === 'ready' || gameState === 'levelTransition' || gameState === 'paused' || gameState === 'deathSequence';
    if (drawing) draw();
  } catch (err) {}
  requestAnimationFrame(frame);
}

if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.ellipse) {
  CanvasRenderingContext2D.prototype.ellipse = function (x, y, rx, ry, rotation, startAngle, endAngle, anticlockwise) {
    this.save();
    this.translate(x, y);
    this.rotate(rotation || 0);
    this.scale(Math.max(0.01, rx), Math.max(0.01, ry));
    this.arc(0, 0, 1, startAngle || 0, endAngle == null ? Math.PI * 2 : endAngle, !!anticlockwise);
    this.restore();
    return this;
  };
}
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

function handleNativeBack() {
  const sp = document.getElementById('settingsPanel');
  if (sp && sp.classList.contains('open')) { sp.classList.remove('open'); return true; }
  const pe = document.getElementById('photoEdit');
  if (pe && pe.classList.contains('open')) { closePhotoEdit(); return true; }
  if (gameState === 'playing') {
    stateBeforePause = 'playing';
    gameState = 'paused';
    document.getElementById('endZenBtn').style.display = (endlessMode || descendMode || dailyMode || tuftMode) ? 'block' : 'none';
    pauseOverlay.style.display = 'flex';
    startMusic();
    setCanvasPlayable(false);
    saveLiveRun();
    return true;
  }
  if (gameState === 'paused') {
    gameState = stateBeforePause;
    pauseOverlay.style.display = 'none';
    setCanvasPlayable(true);
    startMusic();
    return true;
  }
  const ov = document.getElementById('sharePreview');
  if (ov && ov.classList.contains('open')) { closeSharePreview(); return true; }
  if (gameState === 'shop' || gameState === 'modeSelect' || gameState === 'gallery') {
    gameState = 'mainMenu';
    showScreen(mainMenuUI);
    return true;
  }
  if (gameState === 'ready' || gameState === 'over') {
    goToMainMenu();
    return true;
  }
  return false;
}

function isUiTap(el) {
  if (!el || !el.closest) return false;
  if (el.closest('#volBtn, #volPanel, #pauseBtn, #pauseOverlay, #langBox, #adOverlay, #settingsBtn, #settingsPanel, #photoBtn, #photoClearBtn, #photoFitBtn, #photoPick, #photoEdit, #shareBtn, #shareScoreBtn, #sharePreview, #galleryBtn, #hungerLine, #shopTabs, #gearBox, #crateOverlay, #prestigeBtn, #helpBtn, #tipBubble, .modeStarBtn, .closeX, #exitAppBtn')) return true;
  if (el.closest('#mainMenuUI, #modeSelectUI, #endUI, #shopUI, #galleryUI')) return true;
  if (gameState === 'mainMenu' || gameState === 'modeSelect' || gameState === 'shop' || gameState === 'gallery' || gameState === 'over') {
    if (el.closest('#overlay')) return true;
  }
  return false;
}

    const rect = canvas.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
      const cx = (e.clientX != null) ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
      const cy = (e.clientY != null) ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
      if (cx != null && cy != null) {
        const gameX = (cx - rect.left) * (VW / rect.width);
        const gameY = (cy - rect.top) * (VH / rect.height);
        const btnW = 140, btnH = 40;
        const btnX = paddle.x + paddle.w / 2 - btnW / 2;
        const btnY = paddle.y + paddle.h + 6;
        if (gameX >= btnX && gameX <= btnX + btnW && gameY >= btnY && gameY <= btnY + btnH) {

async function setupFishNotifs() {
  try {

    }
    const perm = await LN.requestPermissions();
    if (perm && perm.display === 'denied') return;
    const ids = [{ id: 801 }, { id: 802 }, { id: 803 }];
    for (let i = 1; i <= 12; i++) ids.push({ id: 710 + i });
    try { await LN.cancel({ notifications: ids }); } catch (e) {}
    const fish = (ecoState.fish || [])[0];
    const def = fish ? fishDef(fish.id) : FISH[7];
    const name = t(def.key);
    const jokes = [
      name + ' tankta şınav çekiyor. Gelmezsen yarın kaçar.',
      'Saat 22. ' + name + ' “ben devasa bir efsaneyim, bakılmak isterim” diyor.',
      name + ' camı yalıyor. Yokluğuna damga basacak.',
      'Akvaryum: ' + name + ' istifini bozdu. Bir el yeter.'
    ];
    const at = new Date();
    at.setHours(22, 0, 0, 0);
    if (at.getTime() <= Date.now() + 60000) at.setDate(at.getDate() + 1);
    await LN.schedule({
      notifications: [{
        id: 801,

        body: jokes[at.getDate() % jokes.length],
        channelId: 'kirmatas',
        schedule: { at: at, allowWhileIdle: true }
      }]
    });
  } catch (e) {}
}

function drawScoreCard() {
  const c = document.createElement('canvas');
  c.width = 720;
  c.height = 1080;
  const x = c.getContext('2d');

  // --- 1. Derin Kozmik Arka Plan ---
  const bg = x.createLinearGradient(0, 0, 720, 1080);
  bg.addColorStop(0, '#120524');
  bg.addColorStop(0.35, '#070212');
  bg.addColorStop(0.7, '#040d18');
  bg.addColorStop(1, '#02060c');
  x.fillStyle = bg;
  x.fillRect(0, 0, 720, 1080);

  // Arka plan ortam ışığı
  const glow = x.createRadialGradient(360, 480, 40, 360, 480, 420);
  glow.addColorStop(0, 'rgba(64,196,255,0.22)');
  glow.addColorStop(0.6, 'rgba(179,136,255,0.12)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = glow;
  x.fillRect(0, 0, 720, 1080);

  // --- 2. Lüks Altın Çift Kenarlık & Arkad Braketleri ---
  x.strokeStyle = 'rgba(255,215,64,0.7)';
  x.lineWidth = 3;
  x.strokeRect(28, 28, 664, 1024);
  x.strokeStyle = 'rgba(255,255,255,0.2)';
  x.lineWidth = 1;
  x.strokeRect(36, 36, 648, 1008);

  // Altın köşe süsleri
  const cs = 24;
  x.fillStyle = '#ffd54f';
  [[28, 28], [692, 28], [28, 1052], [692, 1052]].forEach(([px, py]) => {
    x.fillRect(px - 5, py - 5, 10, 10);
  });

  // --- 3. Başlık Tipografisi ---
  x.textAlign = 'center';
  x.fillStyle = 'rgba(255,255,255,0.55)';
  x.font = '800 18px -apple-system, system-ui, sans-serif';
  x.letterSpacing = '6px';
  x.fillText('ARCADE BRICK BREAKER', 360, 95);

  x.fillStyle = '#ffd54f';
  x.font = '900 58px -apple-system, system-ui, sans-serif';
  x.shadowColor = 'rgba(255,213,79,0.6)';
  x.shadowBlur = 18;
  x.fillText('KIRMATAŞ', 360, 158);
  x.shadowBlur = 0;

  // --- 4. Merkezde Seçili 3D Kristal Top Çizimi ---
  const activeSkin = SKINS.find(s => s.id === selectedSkin) || SKINS[0];
  const ballX = 360, ballY = 320, ballR = 64;

  // Topun Alt Yumuşak Gölgesi
  x.fillStyle = 'rgba(0,0,0,0.45)';
  x.beginPath();
  x.ellipse(ballX, ballY + ballR * 0.95, ballR * 0.9, ballR * 0.32, 0, 0, Math.PI * 2);
  x.fill();

  // Topun Dış Haleleri
  const skinRgbVal = hexToRgb(activeSkin.main);
  const ballAura = x.createRadialGradient(ballX, ballY, ballR * 0.7, ballX, ballY, ballR * 1.8);
  ballAura.addColorStop(0, `rgba(${skinRgbVal.r},${skinRgbVal.g},${skinRgbVal.b},0.45)`);
  ballAura.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = ballAura;
  x.beginPath();
  x.arc(ballX, ballY, ballR * 1.8, 0, Math.PI * 2);
  x.fill();

  // Topun 3D Küresel Gövdesi
  const sGrad = x.createRadialGradient(ballX - ballR * 0.32, ballY - ballR * 0.35, ballR * 0.08, ballX, ballY, ballR * 1.05);
  sGrad.addColorStop(0, '#ffffff');
  sGrad.addColorStop(0.25, activeSkin.main);
  sGrad.addColorStop(0.85, activeSkin.dark || '#37474f');
  sGrad.addColorStop(1, 'rgba(255,255,255,0.3)');
  x.fillStyle = sGrad;
  x.beginPath();
  x.arc(ballX, ballY, ballR, 0, Math.PI * 2);
  x.fill();

  // Çift Specular Highlight
  x.fillStyle = 'rgba(255,255,255,0.85)';
  x.beginPath();
  x.ellipse(ballX - ballR * 0.32, ballY - ballR * 0.32, ballR * 0.32, ballR * 0.22, -0.6, 0, Math.PI * 2);
  x.fill();

  // --- 5. Skor Bilgileri ---
  x.fillStyle = 'rgba(255,255,255,0.65)';
  x.font = '800 22px -apple-system, system-ui, sans-serif';
  x.fillText(t('score').toUpperCase(), 360, 465);

  x.fillStyle = '#ffffff';
  x.font = '900 96px -apple-system, system-ui, sans-serif';
  x.shadowColor = 'rgba(0,0,0,0.8)';
  x.shadowBlur = 10;
  x.fillText(String(lastEndStats.score || 0), 360, 565);
  x.shadowBlur = 0;

  // Rozet Paneli (Kombo & Seviye)
  const badgeW = 460, badgeH = 110;
  const bx = 360 - badgeW / 2, by = 625;
  x.fillStyle = 'rgba(255,255,255,0.06)';
  x.beginPath();
  x.roundRect(bx, by, badgeW, badgeH, 20);
  x.fill();
  x.strokeStyle = 'rgba(255,255,255,0.18)';
  x.lineWidth = 1.5;
  x.stroke();

  // Kombo Bölümü
  x.fillStyle = '#00e5ff';
  x.font = '800 20px -apple-system, system-ui, sans-serif';
  x.fillText('MAKS KOMBO', bx + badgeW * 0.28, by + 42);
  x.fillStyle = '#ffffff';
  x.font = '900 42px -apple-system, system-ui, sans-serif';
  x.fillText('x' + (lastEndStats.combo || 0), bx + badgeW * 0.28, by + 90);

  // Ayırıcı çizgi
  x.strokeStyle = 'rgba(255,255,255,0.18)';
  x.lineWidth = 1.2;
  x.beginPath();
  x.moveTo(360, by + 20);
  x.lineTo(360, by + badgeH - 20);
  x.stroke();

  // Seviye / Aşama Bölümü
  x.fillStyle = '#ffd54f';
  x.font = '800 20px -apple-system, system-ui, sans-serif';
  x.fillText('AŞAMA', bx + badgeW * 0.72, by + 42);
  x.fillStyle = '#ffffff';
  x.font = '900 36px -apple-system, system-ui, sans-serif';
  x.fillText(String(lastEndStats.stage || '1'), bx + badgeW * 0.72, by + 88);

  // --- 6. Alt Bilgi & Meydan Okuma ---
  x.fillStyle = '#ff80ab';
  x.font = '800 26px -apple-system, system-ui, sans-serif';
  x.fillText('🔥 Bu skoru geçebilir misin?', 360, 810);

  x.fillStyle = 'rgba(255,255,255,0.4)';
  x.font = '700 18px -apple-system, system-ui, sans-serif';
  x.fillText('kirmatas.app • Mobil Tuğla Kırma', 360, 980);

  return c.toDataURL('image/png');
}

function dataUrlToBlob(dataUrl) {
  const parts = String(dataUrl || '').split(',');
  const mime = ((parts[0].match(/:(.*?);/) || [])[1]) || 'image/png';
  const bin = atob(parts[1] || '');
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function shareScoreToWhatsApp() {
  const caption = tf('shareRun', {
    score: lastEndStats.score || 0,
    combo: lastEndStats.combo || 0,
    stage: lastEndStats.stage || ''
  });
  try {
    const file = new File([dataUrlToBlob(drawScoreCard())], 'kirmatas.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Kırmataş', text: caption });
      return;
    }
  } catch (e) {}
  try {
    const Cap = window.Capacitor;
    const Share = Cap && Cap.Plugins && Cap.Plugins.Share;
    if (Share && Share.share) {
      await Share.share({ title: 'Kırmataş', text: caption, dialogTitle: t('shareCard') });
      return;
    }
  } catch (e) {}
  try {
    if (navigator.share) { await navigator.share({ title: 'Kırmataş', text: caption }); return; }
  } catch (e) {}
}

function hideTip() {

function showTip(text, anchor) {
  const el = document.getElementById('tipBubble');
  if (!el || !text) return;
  el.textContent = text;
  el.classList.add('show');
  const r = (anchor && anchor.getBoundingClientRect) ? anchor.getBoundingClientRect() : { left: 16, right: 80, top: 48, bottom: 86 };
  let left = r.left - 10;
  if (left + 300 > window.innerWidth) left = window.innerWidth - 312;
  if (left < 8) left = 8;
  let top = r.bottom + 8;
  if (top + 140 > window.innerHeight) top = Math.max(8, r.top - 148);
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  clearTimeout(showTip._t);
  showTip._t = setTimeout(hideTip, 4500);
}
