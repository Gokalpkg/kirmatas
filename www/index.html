<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kırmataş</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --menu-bg: radial-gradient(ellipse at 50% -18%, rgba(245,210,122,0.16), transparent 48%),
               linear-gradient(180deg, #0c0d12 0%, #07080c 52%, #05060a 100%);
    --menu-logo: #f5d27a;
    --menu-logo-glow: rgba(245,180,70,0.28);
    --menu-card: linear-gradient(165deg, rgba(255,255,255,0.07), rgba(10,11,16,0.92));
    --menu-card-border: rgba(255,255,255,0.1);
    --menu-gold: #f0c75e;
    --menu-classic: linear-gradient(145deg,#ff7a59,#f0b429);
    --menu-zen: linear-gradient(145deg,#4db7ff,#3d7cff);
    --menu-descend: linear-gradient(145deg,#b07cff,#ff6b9d);
    --menu-daily: linear-gradient(145deg,#f5d27a,#ff9a4a);
    --menu-daily-ink: #2a1800;
    --menu-ghost-border: rgba(255,255,255,0.14);
    --ui-ink: #eef1f6;
    --ui-muted: rgba(238,241,246,0.55);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background: var(--menu-bg);
    font-family: "Bahnschrift", "Segoe UI Variable Text", "Segoe UI", "Candara", sans-serif;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
    letter-spacing: -0.015em;
    -webkit-font-smoothing: antialiased;
    color: var(--ui-ink);
  }
  button, .bigBtn, #modeButtons button { touch-action: manipulation; cursor: pointer; }
  #playInput {
    position:fixed; left:0; top:0; width:100%; height:100%;
    z-index:4; pointer-events:none; touch-action:none;
    background:transparent;
  }
  #playInput.hot { pointer-events:auto; }
  #gameCanvas {
    display:block; margin:0 auto;
    position:fixed; left:0; top:0; z-index:1;
    pointer-events:none;
    touch-action:none;
  }
  #overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding: calc(12px + env(safe-area-inset-top, 0px)) 18px calc(16px + env(safe-area-inset-bottom, 0px));
    z-index:80;
    pointer-events:none;
    touch-action: manipulation;
  }
  #overlay h1 { font-size: 2em; margin-bottom: 12px; }
  #overlay p { font-size: 1.05em; opacity:0.9; margin-bottom: 4px; }
  .screen { display:none; flex-direction:column; align-items:center; pointer-events:none; }
  .screen.active { display:flex; pointer-events:auto; }
  #hud {
    position:fixed; top:14px; left:0; width:100%;
    display:flex; justify-content:space-between; align-items:center; padding:0 56px;
    color:#fff; font-size:0.82em; font-weight:800;
    z-index:5; pointer-events:none; gap:6px;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #hudBest { display:none !important; }
  #hud span {
    background: rgba(8,10,16,0.72);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 6px 10px;
    box-shadow: none;
    backdrop-filter: blur(8px);
    font-weight: 700;
  }
  #livesDisplay { letter-spacing: 0.05em; }
  #scoreDisplay { transition: color 0.3s ease, text-shadow 0.3s ease; }
  #levelDisplay { font-size:0.82em; flex:1; text-align:center; padding:0 4px; }
  #questBox {
    width:100%; max-width:320px; text-align:center; font-size:0.76em; font-weight:700;
    margin:14px 0 0; padding:8px 12px; border-radius:12px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    color: var(--ui-muted); opacity:1;

  #questBox:empty { display:none; }
  .modeWrap:nth-child(5) { grid-column: 1 / -1; }
  .modeWrap:nth-child(5) .modeCard { min-height:56px; }
  #dailyBtn.hunger {
    animation: hungerPulse 1.8s var(--ease-out) infinite;
    box-shadow: 0 0 0 1px rgba(255,180,60,0.35);
  }
  @keyframes hungerPulse {
    0%, 100% { filter: brightness(1); transform: scale(1); }
    50% { filter: brightness(1.06); transform: scale(1.01); }
  }
  #mainMenuUI {
    width:min(360px, 90vw);
    max-height: 88vh;
    overflow-y: auto;
    padding:36px 20px 22px;
    border-radius:26px;
    background: var(--menu-card);
    border: 1px solid var(--menu-card-border);
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    animation: menuIn 0.55s var(--ease-out) both;
  }
  @keyframes menuIn {
    from { opacity:0; transform: translateY(14px) scale(0.985); }
    to { opacity:1; transform: translateY(0) scale(1); }
  }
  #mainMenuUI h1.logoMark {
    font-size:clamp(2.2em, 10vw, 2.7em); letter-spacing:-0.03em; font-weight:800; margin:0 0 8px; line-height:0.98;
    background: linear-gradient(180deg, #fff6d8 0%, #f5d27a 42%, #e8a23a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 18px rgba(232,140,40,0.22));
    pointer-events:none;
  }
  .brandSub, .brickRow, .menuSectionLabel, #mainMenuUI .meta, #questBox { pointer-events:none; }
  .brandSub { display:none; }
  .brickRow { display:none; }
  .menuSectionLabel { display:none; }
  #mainMenuUI .meta.goldLine {
    font-size:0.86em; font-weight:650; color: var(--menu-gold); margin: 0 0 22px; opacity:0.88;
  }
  .modeGrid {
    width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  #tuftBtn { background:linear-gradient(160deg,#c8a27a,#8d6e63); }
  #ecoTank {
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  #ecoTank .ecoWater {
    position:absolute; left:0; right:0; bottom:0; height:42%;
    background:linear-gradient(180deg, rgba(20,80,120,0.08), rgba(8,40,70,0.38));
  }
  #ecoTank .ecoSand {
    position:absolute; left:0; right:0; bottom:0; height:18%;
    background:linear-gradient(180deg, rgba(194,168,110,0.18), rgba(92,70,40,0.35));
  }
  #ecoTank .ecoPlant, #ecoTank .ecoBug {
    position:absolute; pointer-events:none;

    width:10px; border-radius:8px 8px 2px 2px; bottom:12%;

  }

  }
  @keyframes ecoSwim {
    0%, 100% { transform: translateX(0); }

  #ecoIdleLine { display:none; }
  .modeCard {

  .modeCard span { font-size:0.94em; letter-spacing:-0.01em; }
  .modeStarBtn { display:none !important; }
  #hungerLine { display:none !important; }
  #prestigeMark { display:none !important; }
  .menuExtras {
    width:100%; display:flex; gap:8px; align-items:center; margin-top:18px;
  }

  }

    width:40px; height:40px; border-radius:12px; flex:0 0 auto;
  }
  #helpBtn {
    position:fixed; z-index:147;
    width:42px; height:38px; border-radius:19px;

    display:none; align-items:center; justify-content:center;

    top: calc(10px + env(safe-area-inset-top, 0px));
    right:62px;
  }

  #tipBubble {
    display:none; position:fixed; z-index:210;
    max-width:min(320px, 82vw); padding:12px 14px; border-radius:14px;
    background:rgba(12,8,24,0.96); border:1px solid rgba(255,210,140,0.4);
    color:#fff; font-size:0.86em; font-weight:700; line-height:1.4;
    pointer-events:none; text-align:left; white-space:pre-wrap;
  }
  #tipBubble.show { display:block; }
  #playBtn { background:var(--menu-classic); }
  #endlessBtn { background:var(--menu-zen); }
  #descendBtn { background:var(--menu-descend); }
  #dailyBtn { background:var(--menu-daily); color:var(--menu-daily-ink); }
  #dailyBtn span, #dailyBtn small { color:var(--menu-daily-ink); }
  .menuExtras { display:flex; gap:8px; width:100%; margin-top:4px; align-items:stretch; }
  .menuExtras .closeX { height:auto; min-height:48px; }
  .ghostBtn {
    flex:1; margin-top:0; min-width:0; padding:12px 8px; font-size:0.95em;
    background:rgba(255,255,255,0.08); border:1px solid var(--menu-ghost-border);
    box-shadow:none; color:#fff;
  }
  .goldLine {
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 14px; border-radius:14px; margin:2px 0 4px;
    background:rgba(245,210,122,0.1); border:1px solid rgba(245,210,122,0.22);
  }
  #hungerLine {
    display:none !important;
  }
  #hungerLine.show { display:none !important; }
  .modeHint { opacity:0.85; font-size:0.92em; margin:4px 0 0; }
  .bigBtn small { display:block; font-size:0.72em; font-weight:700; opacity:0.92; margin-top:3px; }
  .trailPreview { display:flex; align-items:center; gap:3px; margin-right:8px; }
  .trailPreview i { width:7px; height:7px; border-radius:50%; background:#fff; }
  #readyBest {
    margin:8px 0 10px; padding:8px 14px; border-radius:999px;
    background:rgba(255,215,64,0.16); border:1px solid rgba(255,215,64,0.35);
    font-weight:800; font-size:1.02em; letter-spacing:0.02em;
  }
  #readyBest:empty { display:none; }
  #modeButtons { flex-wrap:wrap; justify-content:center; }
  #modeButtons button { flex-direction:column; gap:4px; min-width:96px; }
  #modeButtons button small { display:block; font-size:0.78em; font-weight:800; opacity:0.9; }
  #hudBest { font-size:0.78em; opacity:0.92; }
  #settingsBtn {
    position:fixed; z-index:145;
    width:42px; height:38px; border-radius:19px;
    background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.35);
    color:#fff; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer; touch-action:manipulation;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right:14px;
  }
  #settingsPanel {
    display:none; position:fixed; z-index:93;
    right:14px; top: calc(54px + env(safe-area-inset-top, 0px));
    width:min(280px, 86vw); max-height:72vh; overflow-y:auto;
    flex-direction:column; align-items:stretch; gap:8px;
    background:rgba(18,8,31,0.96);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:18px; padding:12px;
    pointer-events:auto; touch-action:manipulation;
    text-align:left;
    z-index:146;
  }
  #settingsPanel.open { display:flex; }
  #settingsPanel h3 { font-size:0.78em; letter-spacing:0.16em; text-transform:uppercase; opacity:0.7; margin:0 2px 4px; }
  #settingsBtn svg { display:block; }
  #readySub1:empty, #readyTitle:empty { display:none; }
  #overlay.readyLite {
    justify-content:flex-start;
    padding-top: calc(58px + env(safe-area-inset-top, 0px));
  }
  #readyUI.screen {
    width:min(280px, 82vw);
    padding:12px 14px 10px;
    background:rgba(8,9,14,0.7);
    box-shadow:0 12px 32px rgba(0,0,0,0.28);
  }
  #readyUI.screen.active { pointer-events:none; }
  #readyUI h1 { font-size:1.15em; margin-bottom:4px; }
  #readyUI p { margin-bottom:2px; font-size:0.92em; }
  #pauseBtn, #volBtn {
    position:fixed; z-index:20;
    width:42px; height:38px; border-radius:19px;
    background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.35);
    color:#fff; font-size:0.72em; font-weight:700; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer; touch-action:manipulation;
    top: calc(10px + env(safe-area-inset-top, 0px));
  }
  #pauseBtn, #volBtn { z-index:145; }
  #pauseBtn { right:14px; }
  #volBtn { left:14px; }
  #volPanel {
    display:none; position:fixed; z-index:146;
    left:56px; top: calc(12px + env(safe-area-inset-top, 0px));
    flex-direction:column; align-items:stretch; gap:6px;
    background:rgba(18,8,31,0.94);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:18px; padding:10px 12px;
    pointer-events:auto; touch-action:manipulation;
    min-width:168px;
  }
  #volPanel.open { display:flex; }
  .volRow { display:flex; align-items:center; gap:8px; }
  .volRow span { width:64px; font-size:0.78em; text-align:left; }
  #musicSlider, #sfxSlider, #vibeSlider { width:120px; height:26px; accent-color:#40c4ff; }
  #effectsRow {
    position:fixed; left:0; width:100%;
    display:flex; justify-content:center; gap:5px; flex-wrap:wrap;
    padding:0 60px; z-index:5; pointer-events:none;
    top: calc(48px + env(safe-area-inset-top, 0px));
  }
  .effectChip {
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.35);
    border-radius:14px; padding:2px 8px; color:#fff; font-size:0.72em;
  }
  .effectChip.debuff { border-color:#ff1744; background:rgba(255,23,68,0.18); }
  #comboBanner {
    display:none; position:fixed; left:50%; top:22%; transform:translate(-50%,-50%) scale(0.86);
    z-index:70; pointer-events:none; font-weight:800; letter-spacing:0.04em;
    font-size:clamp(1.4em, 7vw, 2.1em); color:#ffe8b0; text-shadow:0 2px 0 rgba(0,0,0,0.55);
  }
  #comboBanner.show { display:block; animation: comboPop 0.55s ease-out; }
  #comboBanner.fever { color:#ffcc80; font-size:clamp(1.5em, 7.5vw, 2.2em); }
  @keyframes comboPop {
    0% { opacity:0; transform:translate(-50%,-40%) scale(0.5); }
    18% { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    100% { opacity:0; transform:translate(-50%,-62%) scale(1.18); }
  }
  #shopTabs { display:flex; gap:6px; width:100%; margin:8px 0 4px; position:sticky; top:0; z-index:4; background:rgba(8,9,14,0.94); padding:8px 0 6px; }
  #shopTabs button {
    flex:1; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.05);
    color:#fff; border-radius:12px; padding:8px 6px; font-weight:700; font-size:0.76em;
    pointer-events:auto; touch-action:manipulation;
  }
  #shopTabs button.on { background: var(--menu-gold); color:#1a1400; border-color: transparent; }
  .ecoFish {
    position:absolute; pointer-events:none;
    border-radius: 60% 80% 55% 80%;
    animation: ecoSwim 4.8s ease-in-out infinite;
  }
  .ecoFish:after {
    content:''; position:absolute; right:-28%; top:18%;
    width:38%; height:55%;
    background: inherit; clip-path: polygon(0 50%, 100% 0, 100% 100%);
    opacity:0.9;
  }
  .ecoFish.legend {
    z-index:1;
    animation-duration: 7s;
    filter: brightness(1.12);
  }
  @keyframes ecoSwim {
    0%, 100% { transform: translateX(0) rotate(-4deg); }
    50% { transform: translateX(28px) rotate(6deg); }
  }
  #endHook { font-size:0.88em; font-weight:700; opacity:0.88; margin:4px 0 8px; max-width:320px; line-height:1.35; }
  #endHook:empty { display:none; }
  #coachHud {
    display:none; position:fixed; left:50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%); z-index:72; pointer-events:none;
    width:min(340px, 88vw); padding:10px 14px; border-radius:16px;
    background:rgba(8,6,20,0.82); border:1px solid rgba(255,215,64,0.4);
    color:#ffe082; font-weight:800; font-size:0.95em; text-align:center;
  }
  #coachHud.show { display:block; }

  }

  .galDot {

    border: 1px solid rgba(255,255,255,0.3);
  }

  .galItem span { position:absolute; bottom:4px; font-size:0.52em; font-weight:800; opacity:0.85; }
  #sharePreview {
    display:none; position:fixed; inset:0; z-index:220;

  }

  #shareWaBtn { background:linear-gradient(90deg,#25d366,#128c7e); min-width:240px; color:#fff; }

    50% { transform: scale(1.07); filter: brightness(1.18); }
  }
  .bigBtn, #modeButtons button { transition: transform 0.16s var(--ease-out), filter 0.16s ease; }

        navigator.vibrate([Math.max(20, Math.round(45 * m)), 40, Math.max(25, Math.round(55 * m))]);
      } else if (Array.isArray(pattern)) {
        navigator.vibrate(pattern.map((n, i) => i % 2 ? n : Math.max(4, Math.round(n * m))));
      } else {
        navigator.vibrate(Math.max(6, Math.round((pattern || 16) * m)));
      }
    }
  } catch (e) {}
}

let VW, VH;
const BOTTOM_MARGIN = 168;

function getRenderDpr() {
  return Math.min(1.5, window.devicePixelRatio || 1);
}

function handleResize() {
  const dpr = getRenderDpr();
  const iw = window.innerWidth || document.documentElement.clientWidth || 360;
  const ih = window.innerHeight || document.documentElement.clientHeight || 640;
  const newVW = Math.max(280, Math.min(iw, 480));
  const newVH = Math.max(400, ih);
  if (!newVW || !newVH) return;

  if (VW && VH && bricks && bricks.length) {
    const scaleX = newVW / VW;
    const scaleY = newVH / VH;
    bricks.forEach(b => {
      b.x *= scaleX; b.w *= scaleX; b.y *= scaleY; b.h *= scaleY;
      if (b.moverBaseX !== undefined) b.moverBaseX *= scaleX;
      if (b.moverAmp) b.moverAmp *= scaleX;
    });
    drops.forEach(d => { d.x *= scaleX; d.y *= scaleY; });
    balls.forEach(ball => { ball.x *= scaleX; ball.y *= scaleY; ball.trail = []; });
    if (obstacle) { obstacle.x *= scaleX; obstacle.y *= scaleY; obstacle.w *= scaleX; }
    paddle.baseW *= scaleX;
    paddle.x *= scaleX;
  }

  VW = newVW; VH = newVH;
  canvas.width = Math.round(VW * dpr);
  canvas.height = Math.round(VH * dpr);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  canvas.style.left = Math.max(0, ((window.innerWidth || VW) - VW) / 2) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (paddle) paddle.y = VH - BOTTOM_MARGIN;
}

    if (sfxType === 'clutch') {

    } else if (sfxType === 'boss') {
      osc.frequency.setValueAtTime(140, now);

    } else {
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
    }
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.22 * sfxVol, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.36);
  } catch(e) {}
}

// --- LAZER NİŞAN REHBERİ (AIM TRAJECTORY GUIDE) ---
function drawAimGuide() {
  if (gameState !== 'ready' && !(balls && balls.some(b => b && b.stuck))) return;
  const stuckBall = balls && balls.find(b => b && b.stuck);
  if (!stuckBall || !paddle) return;
  const hitPos = ((stuckBall.stickFrac || 0.5) - 0.5) * 2;
  const angle = hitPos * (Math.PI / 3.2);
  let startX = stuckBall.x;
  let startY = stuckBall.y;
  let dirX = Math.sin(angle);
  let dirY = -Math.cos(angle);

  ctx.save();
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.65)';
  ctx.lineWidth = 2.2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(startX, startY);

  let curX = startX, curY = startY;
  for (let step = 0; step < 180; step += 6) {
    curX += dirX * 6;
    curY += dirY * 6;
    if (curX <= 12 || curX >= VW - 12) {
      ctx.lineTo(curX, curY);
      dirX = -dirX;
    }
    if (curY <= 15) {
      ctx.lineTo(curX, curY);
      break;
    }
  }
  ctx.lineTo(curX, curY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath();
  ctx.arc(curX, curY, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

    ufo.spawnTimer = (ufo.spawnTimer || 0) + dt;
    if (ufo.spawnTimer > 32) {
      ufo.spawnTimer = 0;
      ufo.active = true;
      const fromLeft = Math.random() < 0.5;
      ufo.vx = fromLeft ? 75 : -75;

      announceEvent('🛸 KARGO GEMİSİ GELDİ!', '#ffd700', 'ufo');
      playSound('magic');
    }
    return;
  }
  ufo.x += ufo.vx * dt;
  if ((ufo.vx > 0 && ufo.x > VW + 55) || (ufo.vx < 0 && ufo.x < -60)) {
    ufo.active = false;
    return;
  }
  if (balls && balls.length) {
    for (let i = 0; i < balls.length; i++) {
      const ball = balls[i];
      if (ball.stuck) continue;
      const ucx = ufo.x + ufo.w / 2, ucy = ufo.y + ufo.h / 2;
      if (Math.hypot(ball.x - ucx, ball.y - ucy) < ball.r + ufo.w * 0.42) {
        ball.vy = Math.abs(ball.vy);
        ufo.hp--;
        spawnParticles(ucx, ucy, '#ffd700', 14, 150);
        spawnShockwave(ucx, ucy, '#ffd700', 38);
        triggerShake(4, 0.12);
        playSound('steel');
        vibrate('impact');
        if (ufo.hp <= 0) {
          destroyUfo();
          break;
        } else {
          spawnFloatingText(ucx, ucy - 10, '🛸 -1 HP', '#ffd700', false);
        }
      }
    }
  }
  if (ufo.active && lasers && lasers.length) {
    for (let li = lasers.length - 1; li >= 0; li--) {
      const l = lasers[li];
      if (l.x > ufo.x && l.x < ufo.x + ufo.w && l.y > ufo.y && l.y < ufo.y + ufo.h) {
        lasers.splice(li, 1);
        ufo.hp--;
        spawnParticles(l.x, l.y, '#ffd700', 6, 100);
        if (ufo.hp <= 0) { destroyUfo(); break; }
      }
    }
  }
}

      const b = bricks[bi];
      if (!b.alive) continue;
      if (dl.x >= b.x && dl.x <= b.x + b.w && dl.y >= b.y && dl.y <= b.y + b.h) {
        hitBrick(b);
        hit = true;
        spawnParticles(dl.x, dl.y, '#00e676', 4, 80);
        break;
      }
    }
    if (hit || dl.y < 0) droneLasers.splice(i, 1);
  }
}

function drawCompanionDrone() {
  if (!(effects.drone > 0) || !paddle) return;
  const x = (companionDrone && companionDrone.x) || (paddle.x + paddle.w / 2);
  const y = (companionDrone && companionDrone.y) || (paddle.y - 34);
  ctx.save();
  ctx.fillStyle = 'rgba(0, 230, 118, 0.45)';
  ctx.beginPath();
  ctx.arc(x, y + 8, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#263238';
  ctx.beginPath();
  ctx.roundRect(x - 14, y - 7, 28, 14, 5);
  ctx.fill();
  ctx.strokeStyle = '#00e676';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.fillStyle = '#00e676';
  ctx.fillRect(x - 8, y - 2, 16, 4);

  ctx.fillStyle = '#69f0ae';
  if (droneLasers) {
    droneLasers.forEach(dl => {
      ctx.fillRect(dl.x - 1.5, dl.y, 3, 11);
    });
  }
  ctx.restore();
}

// --- 6.e ZAMAN DONDURUCU VIGNETTE (CHRONO EFFECT) ---
function drawChronoVignette() {
  if (!(effects.chrono > 0)) return;
  ctx.save();
  const cPulse = (Math.sin(globalTime * 12) + 1) * 0.5;
  const rad = Math.max(VW, VH);
  const cg = ctx.createRadialGradient(VW / 2, VH / 2, rad * 0.3, VW / 2, VH / 2, rad * 0.75);
  cg.addColorStop(0, 'rgba(0,0,0,0)');
  cg.addColorStop(1, `rgba(0, 229, 255, ${0.25 + cPulse * 0.15})`);
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, VW, VH);

  ctx.fillStyle = '#e0f7fa';
  ctx.font = '900 13px -apple-system, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⏳ ZAMAN DONDURULDU', VW / 2, 38);
  ctx.restore();
}

// --- 6.f KOZMİK ÇEKİM GİRDABI (VORTEX EFFECT) ---
function tickVortex(dt) {
  if (!(effects.vortex > 0) || !balls || !balls.length) return;
  const vx = VW / 2, vy = VH * 0.42;
  balls.forEach(ball => {
    if (ball.stuck) return;
    const dx = vx - ball.x, dy = vy - ball.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 150 && dist > 10) {
      const force = (1 - dist / 150) * 180 * dt;
      ball.vx += (dx / dist) * force;
      ball.vy += (dy / dist) * force;
    }
  });
}

function drawVortex() {
  if (!(effects.vortex > 0)) return;
  const vx = VW / 2, vy = VH * 0.42;
  ctx.save();
  ctx.translate(vx, vy);
  ctx.rotate(globalTime * 3.5);
  const vg = ctx.createRadialGradient(0, 0, 4, 0, 0, 65);
  vg.addColorStop(0, '#ffffff');
  vg.addColorStop(0.3, '#d500f9');
  vg.addColorStop(0.7, '#651fff');
  vg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = vg;
  ctx.beginPath();
  ctx.arc(0, 0, 65, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.lineWidth = 2;
  for (let a = 0; a < 3; a++) {
    ctx.rotate((Math.PI * 2) / 3);
    ctx.beginPath();
    ctx.arc(15, 0, 25, 0, Math.PI);
    ctx.stroke();
  }
  ctx.restore();
}

// --- 6.g BOSS MAYINLARI & UYDU KALKANLARI ---
function updateBossMines(dt) {
  if (!bossMines || !bossMines.length) return;
  for (let i = bossMines.length - 1; i >= 0; i--) {
    const m = bossMines[i];
    m.life -= dt;
    if (paddle && !paddle.exploded &&
        m.x > paddle.x && m.x < paddle.x + paddle.w &&
        m.y > paddle.y - m.r && m.y < paddle.y + paddle.h + m.r) {
      triggerShake(7, 0.25);
      vibrate('heavy');
      playSound('bomb');
      spawnShockwave(m.x, m.y, '#ff1744', 50);
      spawnParticles(m.x, m.y, '#ff5252', 18, 170);
      if (!tuftMode && !endlessMode && lives > 0) {
        lives--;
        livesDisplay.textContent = formatLives();
      }
      bossMines.splice(i, 1);
      continue;
    }
    if (balls && balls.length) {
      for (let bi = 0; bi < balls.length; bi++) {
        const ball = balls[bi];
        if (Math.hypot(ball.x - m.x, ball.y - m.y) < ball.r + m.r) {
          spawnShockwave(m.x, m.y, '#ff5252', 40);
          spawnParticles(m.x, m.y, '#ff8a80', 12, 130);
          playSound('laser');
          bossMines.splice(i, 1);
          break;
        }
      }
    }
    if (m.life <= 0) bossMines.splice(i, 1);
  }
}

function drawBossMines() {
  if (!bossMines || !bossMines.length) return;
  ctx.save();
  bossMines.forEach(m => {
    const pulse = (Math.sin(globalTime * 14) + 1) * 0.5;
    ctx.fillStyle = '#d50000';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(255, 23, 68, ${0.4 + pulse * 0.6})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r + 3 + pulse * 4, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.restore();
}

function drawBossShields(b) {
  if (!b || !b.shields) return;
  const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  const orbitR = Math.max(b.w, b.h) * 0.72;
  ctx.save();
  b.shields.forEach(sh => {
    if (sh.hp <= 0) return;
    const sx = bcx + Math.cos(sh.ang) * orbitR;
    const sy = bcy + Math.sin(sh.ang) * orbitR;
    ctx.fillStyle = '#00e5ff';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(sx, sy, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
  ctx.restore();
}

function bossShieldsActive(b) {
  return !!(b && b.shields && b.shields.some(sh => sh.hp > 0));
}

function doBossTeleport(b) {
  const oldX = b.x + b.w / 2, oldY = b.y + b.h / 2;
  spawnShockwave(oldX, oldY, '#b388ff', 85);
  spawnParticles(oldX, oldY, '#d1c4e9', 24, 200);
  triggerShake(7, 0.22);
  vibrate('combo');
  playSound('magic');
  bossMines.push({ x: oldX - 25, y: oldY, r: 10, life: 18, color: '#ff1744' });
  bossMines.push({ x: oldX + 25, y: oldY, r: 10, life: 18, color: '#ff1744' });
  b.x = 24 + Math.random() * (VW - b.w - 48);

}

  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  const m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
}
function loadWeek() {
  let o = {};
  try { o = JSON.parse(localStorage.getItem('breakoutWeek') || '{}'); } catch (e) { o = {}; }
  if (o.key !== weekKey()) o = { key: weekKey(), runs: 0, daily: false, claimed: false };
  return o;
}
function saveWeek(o) { try { localStorage.setItem('breakoutWeek', JSON.stringify(o)); } catch (e) {} }
function noteWeekRun() {
  const w = loadWeek();
  w.runs = (w.runs || 0) + 1;
  saveWeek(w);
  maybeClaimWeek(w);
}
function noteWeekDaily() {
  const w = loadWeek();
  w.daily = true;
  saveWeek(w);
  maybeClaimWeek(w);
}
function maybeClaimWeek(w) {
  w = w || loadWeek();
  if (w.claimed) return;
  if ((w.runs || 0) < 5 && !w.daily) return;
  w.claimed = true;
  saveWeek(w);
  gold += 40;
  saveGold(gold);
  updateGoldDisplay();
  flashNote(tf('weekDone', { g: 40 }));
}
function weekLineText() {
  const w = loadWeek();
  if (w.claimed) return tf('weekDone', { g: 40 });
  return tf('weekLine', { n: Math.min(5, w.runs || 0) });
}
function refreshHungerLine() {
  const el = document.getElementById('hungerLine');
  if (!el || typeof SKINS === 'undefined') return;
  const miss = SKINS.filter(s => s.id !== 'classic' && !itemOwned('skin', s.id));
  const legends = miss.filter(s => s.rarity === 'legend');
  const crateCost = (typeof CRATES !== 'undefined' && CRATES[0]) ? CRATES[0].cost : 900;
  let text = '';
  let go = 'gallery';
  if (legends.length) { text = tf('huntLegend', { n: legends.length }); go = gold >= crateCost ? 'crate' : 'gallery'; }
  else if (miss.length) { text = tf('huntBalls', { n: miss.length }); go = gold >= crateCost ? 'crate' : 'gallery'; }
  else if (gold < crateCost) { text = tf('huntCrate', { n: crateCost - gold }); go = 'gallery'; }
  else {
    const d = dailyHook();
    text = (d.lastWin === todayKey()) ? t('huntOpen') : t('huntFull');
    go = (d.lastWin === todayKey()) ? 'crate' : 'gallery';
  }
  el.textContent = text;
  el.dataset.go = go;
  el.classList.add('show');
}
function openHunger() {
  const go = (document.getElementById('hungerLine') && document.getElementById('hungerLine').dataset.go) || 'gallery';
  ensureAudio();
  if (go === 'crate') {
    harvestMenuGold();
    shopTab = 'crate';
    renderShop();
    gameState = 'shop';
    showScreen(shopUI);
    overlay.style.display = 'flex';
    setCanvasPlayable(false);
    startMusic();
    return;
  }
  renderGallery();
  renderEcoTank();
  gameState = 'gallery';
  showScreen(galleryUI);
  overlay.style.display = 'flex';
  setCanvasPlayable(false);
  startMusic();
}

  const el = document.getElementById('coachHud');

    el.classList.remove('show');

  }

function loadBoostStock() {
  try { return Object.assign({ life: 0, wide: 0, multi: 0 }, JSON.parse(localStorage.getItem('breakoutBoosts') || '{}')); } catch (e) { return { life: 0, wide: 0, multi: 0 }; }
}
function saveBoostStock() { try { localStorage.setItem('breakoutBoosts', JSON.stringify(boostStock)); } catch (e) {} }
let boostStock = loadBoostStock();
function applyStartBoosts() {
  if (dailyMode) { saveBoostStock(); return; }
  if (warmIfReplay) {
    effects.wide = Math.max(effects.wide, 8);
    warmIfReplay = false;
  }
  const luck = upgradeLvl('luck');
  if (luck > 0 && Math.random() < luck * 0.05) effects.shieldCharges = (effects.shieldCharges || 0) + 1;
  if ((boostStock.life || 0) > 0) { lives += 1; boostStock.life--; }
  if ((boostStock.wide || 0) > 0) {
    effects.wide = Math.max(effects.wide, 14 + upgradeLvl('battery'));
    if (effects.rank) effects.rank.wide = Math.max(effects.rank.wide || 0, 1);
    boostStock.wide--;
  }
  if ((boostStock.multi || 0) > 0) {
    boostStock.multi--;
    applyPowerUp('multi');
  }
  saveBoostStock();
}
function buyBoost(id) {
  const def = BOOST_ITEMS.find(x => x.id === id);
  if (!def) return;
  const have = boostStock[id] || 0;
  if (have >= def.max || gold < def.cost) { playSound('powerupBad'); return; }
  gold -= def.cost;
  saveGold(gold);
  updateGoldDisplay();
  boostStock[id] = have + 1;
  saveBoostStock();
  playSound('powerupGood');
  renderShop();
}

function hexToRgb(hex) {
  const h = String(hex || '').replace('#', '');
  if (h.length === 3) {
    return {
      r: parseInt(h[0] + h[0], 16),
      g: parseInt(h[1] + h[1], 16),
      b: parseInt(h[2] + h[2], 16)
    };
  }
  const n = parseInt(h.slice(0, 6), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function shopBlurb(item, kind) {
  if (item.crate) return t('blurbCrate');
  if (item.look) {
    const key = 'blurb_' + item.look;
    const raw = t(key);
    if (raw !== key) return raw;
  }
  if (item.aura) return t('blurbAura');
  if (item.rarity === 'legend') return t('blurbLegend');
  if (kind === 'paddle') return t('blurbPaddle');
  if (kind === 'trail') return t('blurbTrail');
  if (kind === 'bg') return t('blurbBg');
  if (kind === 'boost') return t('blurbBoost');
  return t('blurbSkin');
}

function addShopRow(list, item, selectedId, onSelect, kind) {
  const owned = !kind || itemOwned(kind, item.id);
  const isSelected = owned && selectedId === item.id;
  const row = document.createElement('div');
  row.className = 'shopItem';
  if (!owned && (item.cost || 0) > gold) row.classList.add('cant');
  if (!item.dots) {
    const dot = document.createElement('span');
    dot.className = 'skinDot' + (item.c1 ? ' paddleDot' : '') + (item.preview ? ' bgDot' : '');
    if (item.preview) {
      dot.style.background = item.preview;
    } else if (item.c1) {
      dot.style.background = 'linear-gradient(90deg,' + item.c1 + ',' + item.c2 + ')';
      dot.style.color = item.c1;
    } else {
      dot.style.background = item.main;
      dot.style.color = item.main;
    }
    row.appendChild(dot);
  }
  decorateShopRow(row, item, kind);
  const name = document.createElement('span');
  name.className = 'shopName';
  name.textContent = (item.label || item.name || '') + (item.aura ? ' · ' + t('auraTag') : '');
  row.appendChild(name);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'bigBtn';
  if (!owned) btn.textContent = (item.crate || (kind === 'skin' && item.id !== 'classic')) ? t('shopFromCrate') : ((item.cost > 0) ? (t('buy') + ' ' + item.cost) : t('locked'));
  else btn.textContent = isSelected ? t('selected') : t('select');
  btn.disabled = isSelected || (!owned && (item.crate || (kind === 'skin' && item.id !== 'classic') || !(item.cost > 0)));
  bindTap(btn, () => {
    if (owned) { onSelect(item); return; }
    if ((item.cost || 0) > 0 && gold >= item.cost) {
      gold -= item.cost;
      saveGold(gold);
      updateGoldDisplay();
      grantItem(kind, item.id, true);
      playSound('powerupGood');
      onSelect(item);
    } else playSound('powerupBad');
  });
  if (item.dots) {
    const prev = document.createElement('span');
    prev.className = 'trailPreview';
    for (let i = 0; i < item.dots; i++) {
      const d = document.createElement('i');
      d.style.opacity = String(0.25 + (i / Math.max(1, item.dots - 1)) * 0.75);
      prev.appendChild(d);
    }
    row.insertBefore(prev, row.firstChild);
  }
  row.appendChild(btn);
  list.appendChild(row);
}

function openCrate(crateId) {
  const crate = CRATES.find(c => c.id === crateId) || CRATES[0];
  if (crateBusy || gold < crate.cost) { playSound('powerupBad'); return; }
  gold -= crate.cost;
  saveGold(gold);
  updateGoldDisplay();
  crateBusy = true;
  const ov = document.getElementById('crateOverlay');
  const res = document.getElementById('crateResult');
  const box = document.getElementById('crateBox');
  if (res) res.textContent = '...';
  if (ov) ov.classList.add('show');
  if (box) { box.style.animation = 'none'; void box.offsetWidth; box.style.animation = ''; }
  playSound('powerupGood');
  setTimeout(() => {
    const loot = pickCrateLoot(crate);
    let msg = '';
    function crateDupGold(name) {
      const n = 60 + Math.floor(Math.random() * 90);
      gold += n;
      saveGold(gold);
      updateGoldDisplay();
      playSound('powerupGood');
      return tf('crateDup', { name: name, n: n });
    }
    if (loot.kind === 'fish') {
      addFish(loot.fish.id);
      msg = tf('crateFish', { name: t(loot.fish.key) });
      playSound('record');
      renderEcoTank();
    } else if (loot.kind === 'ball') {
      if (itemOwned('skin', loot.skin.id)) msg = crateDupGold(loot.skin.name);
      else {
        grantItem('skin', loot.skin.id, true);
        selectedSkin = loot.skin.id;
        saveSelectedSkin(selectedSkin);
        msg = tf('crateBall', { name: loot.skin.name });
        playSound('record');
      }
    } else if (loot.kind === 'paddle') {
      if (itemOwned('paddle', loot.paddle.id)) msg = crateDupGold(loot.paddle.name);
      else {
        grantItem('paddle', loot.paddle.id, true);
        selectedPaddle = loot.paddle.id;
        saveSelectedPaddle(selectedPaddle);
        msg = tf('cratePaddle', { name: loot.paddle.name });
        playSound('record');
      }
    } else if (loot.kind === 'trail') {
      const trailName = t(loot.trail.key);
      if (itemOwned('trail', loot.trail.id)) msg = crateDupGold(trailName);
      else {

function tickGravityWells(dt) {

function pullDropsIntoWells(dt) {
  if (!drops || !drops.length || !gravityWells.length) return;
  for (let i = 0; i < drops.length; i++) {
    const d = drops[i];
    d.vx = d.vx || 0;
    for (let k = 0; k < gravityWells.length; k++) {
      const w = gravityWells[k];
      const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
      const dx = w.x - cx, dy = w.y - cy;
      const dist = Math.hypot(dx, dy) || 1;
      const reach = wellReach(w) * 0.85;
      if (dist > reach) continue;
      const nx = dx / dist, ny = dy / dist;
      const fall = 1 - dist / reach;
      d.vx += nx * (520 * fall) * dt;
      d.y += ny * (90 * fall) * dt;
      if (dist < w.radius * 0.55) {
        d.vx += (paddle ? ((paddle.x + paddle.w / 2) - cx) : 0) * 2.4 * dt;
        d.y += DROP_SPEED * 1.8 * dt;
      }
    }
    d.x += d.vx * dt;
    d.vx *= 0.9;
    d.x = Math.max(4, Math.min(VW - (d.w || 18) - 4, d.x));
  }

function applyGravityWells(ball, dt, maxSpeed) {
  if (!gravityWells || !gravityWells.length || !ball || ball.stuck) return;
  if (paddle && ball.y > paddle.y - 64) return;
  for (let i = 0; i < gravityWells.length; i++) {
    const w = gravityWells[i];
    if (paddle && w.y > paddle.y - 72) continue;
    const dx = w.x - ball.x;
    const dy = w.y - ball.y;
    const dist = Math.max(10, Math.hypot(dx, dy));
    const reach = wellReach(w);
    if (dist > reach) continue;
    const nx = dx / dist, ny = dy / dist;
    const fall = 1 - dist / reach;
    const pull = (w.strength || 2800) * (0.35 + fall * 0.9);
    ball.vx += nx * pull * dt;
    ball.vy += ny * pull * dt * 0.85;
    const spin = (w.spin || 1) * pull * 0.45 * dt;
    ball.vx += -ny * spin;
    ball.vy += nx * spin;
    if (dist < w.radius * 0.7) {
      const kick = (w.kind === 'l' ? 2200 : 1400) * dt;
      ball.vx += -ny * (w.spin || 1) * kick;
      ball.vy += nx * (w.spin || 1) * kick;
      ball.vx -= nx * 900 * dt;
      ball.vy -= ny * 400 * dt;
    }
  }
  const spd = Math.hypot(ball.vx, ball.vy);
  const floor = 220;
  if (spd < floor && spd > 1) {
    ball.vx *= floor / spd;
    ball.vy *= floor / spd;
  }
  const cap = Math.max(300, (maxSpeed || 540) * 1.28);
  const now = Math.hypot(ball.vx, ball.vy);
  if (now > cap) {
    ball.vx *= cap / now;
    ball.vy *= cap / now;
  }

function drawGravityWells() {
  if (!gravityWells || !gravityWells.length) return;
  ctx.save();
  gravityWells.forEach(w => {
    const fade = w.life < 0.9 ? Math.max(0.18, w.life / 0.9) : 1;

const STUCK_BOUNCE_LIMIT = 5;
function registerBounceAndCheckStuck(ball) {
  const key = Math.round(ball.x / 18) + ':' + Math.round(ball.y / 18);
  if (ball.lastBounceKey === key) {
    ball.stuckBounceCount = (ball.stuckBounceCount || 0) + 1;
  } else {
    ball.lastBounceKey = key;
    ball.stuckBounceCount = 1;
  }
  // Yatay sıkışma (anti-horizontal deadlock) kontrolü
  if (Math.abs(ball.vy) < 45) {
    ball.horizStuckCount = (ball.horizStuckCount || 0) + 1;
    if (ball.horizStuckCount >= 3) {
      const spd = Math.max(260, Math.hypot(ball.vx, ball.vy));
      ball.vy = (ball.y < VH * 0.5 ? 1 : -1) * (spd * 0.45);
      ball.horizStuckCount = 0;
    }
  } else {
    ball.horizStuckCount = 0;
  }
  // Plazma Şarjı: Duvarlardan peş peşe 3 kez sektikten sonra top aşırı şarj olur
  ball.wallBounces = (ball.wallBounces || 0) + 1;
  if (ball.wallBounces >= 3 && !(ball.plasmaCharge > 0)) {
    ball.plasmaCharge = 2;
    spawnShockwave(ball.x, ball.y, '#00e5ff', 42);
    spawnFloatingText(ball.x, ball.y - 12, '⚡ PLAZMA ŞARJI!', '#00e5ff', true);
    announceEvent('PLAZMA ŞARJI!', '#00e5ff', 'normal');
    playSound('laser');
    vibrate('combo');
  }
  if (ball.stuckBounceCount >= STUCK_BOUNCE_LIMIT) unstickBall(ball);
}

function unstickBall(ball) {
  const speed = Math.max(280, Math.hypot(ball.vx, ball.vy) || BASE_LAUNCH_SPEED);
  const towardCenter = ball.x < VW / 2 ? 1 : -1;
  const spread = towardCenter * (0.45 + Math.random() * 0.35);
  ball.vx = Math.sin(spread) * speed;
  ball.vy = -Math.abs(Math.cos(spread) * speed);
  if (Math.abs(ball.vx) < speed * 0.32) ball.vx = towardCenter * speed * 0.45;
  ball.x = Math.max(ball.r + 10, Math.min(VW - ball.r - 10, ball.x + towardCenter * 14));
  ball.y = Math.min(Math.max(ball.y, ball.r + 16), paddle.y - ball.r - 16);
  ball.stuckBounceCount = 0;
  ball.lastBounceKey = null;
  ball.lastBrickHitAt = globalTime;
  ball.embedFrames = 0;
  ball.wallStick = 0;
  clampBallInPlay(ball, false);
}

const WALL_CLEAR = 5;
const MIN_WALL_VX = 140;

function kickOffSideWalls(ball) {
  if (!ball || ball.stuck) return;
  const minVx = MIN_WALL_VX;
  const huggingLeft = ball.x - ball.r <= 1.2 && ball.vx <= 8;
  const huggingRight = ball.x + ball.r >= VW - 1.2 && ball.vx >= -8;
  if (huggingLeft) {
    ball.x = ball.r + WALL_CLEAR;
    ball.vx = Math.max(minVx, Math.abs(ball.vx || 0));
    ball.wallStick = (ball.wallStick || 0) + 1;
  } else if (huggingRight) {
    ball.x = VW - ball.r - WALL_CLEAR;
    ball.vx = -Math.max(minVx, Math.abs(ball.vx || 0));
    ball.wallStick = (ball.wallStick || 0) + 1;
  } else {
    ball.wallStick = 0;
  }
  if (ball.wallStick >= 4) {
    const toward = ball.x < VW / 2 ? 1 : -1;
    ball.x = Math.max(ball.r + 18, Math.min(VW - ball.r - 18, ball.x + toward * 22));
    ball.vx = toward * (200 + Math.random() * 70);
    ball.vy = -Math.abs(ball.vy || 260);
    ball.wallStick = 0;
  }
}

function clampBallInPlay(ball, allowBelow) {
  if (!Number.isFinite(ball.x) || !Number.isFinite(ball.y) || !Number.isFinite(ball.vx) || !Number.isFinite(ball.vy)) {
    ball.x = VW / 2;
    ball.y = Math.max(ball.r + 8, paddle.y - 80);
    ball.vx = 140;
    ball.vy = -280;
  }
  if (ball.x - ball.r < 0) {
    ball.x = ball.r + WALL_CLEAR;
    if (ball.vx <= 0) ball.vx = Math.max(MIN_WALL_VX, Math.abs(ball.vx));
  } else if (ball.x + ball.r > VW) {
    ball.x = VW - ball.r - WALL_CLEAR;
    if (ball.vx >= 0) ball.vx = -Math.max(MIN_WALL_VX, Math.abs(ball.vx));
  }
  const maxY = allowBelow ? VH + ball.r + 80 : paddle.y - ball.r - 2;
  if (ball.y - ball.r < 0) {
    ball.y = ball.r + 1.5;
    if (ball.vy < 0) ball.vy = Math.abs(ball.vy);
  }
  ball.y = Math.min(maxY, ball.y);
}

function brickHitY(b) {
  return b.y - (b.slideOffset || 0);
}

function ballHitsRect(ball, x, y, w, h) {
  return ball.x + ball.r > x && ball.x - ball.r < x + w &&
         ball.y + ball.r > y && ball.y - ball.r < y + h;
}

function separateFromRect(ball, x, y, w, h) {
  if (!ballHitsRect(ball, x, y, w, h)) return false;
  const overlapLeft = (ball.x + ball.r) - x;
  const overlapRight = (x + w) - (ball.x - ball.r);
  const overlapTop = (ball.y + ball.r) - y;
  const overlapBottom = (y + h) - (ball.y - ball.r);
  const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
  const pad = 1.25;
  if (minOverlap === overlapTop) {
    ball.y = y - ball.r - pad;
    if (ball.vy > 0) ball.vy = -Math.abs(ball.vy);
  } else if (minOverlap === overlapBottom) {
    ball.y = y + h + ball.r + pad;
    if (ball.vy < 0) ball.vy = Math.abs(ball.vy);
  } else if (minOverlap === overlapLeft) {
    const nx = x - ball.r - pad;
    if (nx < ball.r + WALL_CLEAR) {
      ball.x = Math.max(ball.r + WALL_CLEAR, x + w + ball.r + pad);
      ball.vx = Math.abs(ball.vx) || MIN_WALL_VX;
    } else {
      ball.x = nx;
      if (ball.vx > 0) ball.vx = -Math.abs(ball.vx);
    }
  } else {
    const nx = x + w + ball.r + pad;
    if (nx > VW - ball.r - WALL_CLEAR) {
      ball.x = Math.min(VW - ball.r - WALL_CLEAR, x - ball.r - pad);
      ball.vx = -Math.abs(ball.vx || MIN_WALL_VX);
    } else {
      ball.x = nx;
      if (ball.vx < 0) ball.vx = Math.abs(ball.vx);
    }
  }
  kickOffSideWalls(ball);
  return true;
}

function handleAllBallsLost() {
  combo = 0;
  feverTimer = 0;
  stopMusic();
  if (!tuftMode && remainingBreakable() <= 0) {
    resetBallAndPaddle();
    return;
  }
  noteBallDrop();

    return;
  }
  lives--;

  if (btn) btn.style.display = show ? '' : 'none';
}

  if (adTimerId) { clearInterval(adTimerId); adTimerId = null; }
  const el = document.getElementById('adOverlay');
  if (el) el.classList.remove('show');
  const done = document.getElementById('adDoneBtn');
  if (done) done.style.display = 'none';
}

function rescueDescendBricks() {
  if (!descendMode || !bricks) return;
  let lowest = -Infinity;
  bricks.forEach(b => {
    if (b.alive) lowest = Math.max(lowest, b.y + b.h);
  });
  if (!Number.isFinite(lowest) || lowest < 0) return;
  const safeBottom = paddle.y - 90;
  if (lowest > safeBottom) {
    const lift = lowest - safeBottom;
    bricks.forEach(b => { b.y -= lift; });
  }
}

function continueAfterAd() {
  hideAdOverlay();
  lives = 1;
  livesDisplay.textContent = formatLives();
  if (lastDeathWasDescend) rescueDescendBricks();
  lastDeathWasDescend = false;
  resetBallAndPaddle();
  overlay.style.display = 'flex';
  goToReady();
}

function showRewardedAdThenContinue() {
  if (adContinueUsed) return;
  adContinueUsed = true;
  setAdContinueVisible(false);
  const overlayEl = document.getElementById('adOverlay');
  const timerEl = document.getElementById('adTimer');
  const doneBtn = document.getElementById('adDoneBtn');
  if (!overlayEl) { continueAfterAd(); return; }
  overlayEl.classList.add('show');
  if (doneBtn) doneBtn.style.display = 'none';
  let left = 5;
  if (timerEl) timerEl.textContent = String(left);
  if (adTimerId) clearInterval(adTimerId);
  adTimerId = setInterval(() => {
    left--;
    if (timerEl) timerEl.textContent = String(Math.max(0, left));
    if (left <= 0) {
      clearInterval(adTimerId);
      adTimerId = null;
      if (doneBtn) doneBtn.style.display = 'block';
    }
  }, 1000);
}

  drops.push({
    x: brick.x + brick.w / 2 - 16,
    y: brick.y,

    h: 32,

  for (let i = 0; i < n; i++) {
    particles.push({
      x: b.x + Math.random() * b.w,
      y: b.y + Math.random() * b.h,
      vx: (Math.random() - 0.5) * (last ? 380 : 300),
      vy: -60 - Math.random() * (last ? 260 : 200),
      life: (last ? 0.45 : 0.35) + Math.random() * 0.3,
      maxLife: last ? 0.85 : 0.65,
      color: b.color,
      size: (last ? 5 : 3) + Math.random() * (last ? 7 : 5),
      shard: true,
      rot: Math.random() * 6,
      vr: (Math.random() - 0.5) * (last ? 22 : 16)

  }
}

  const n = Math.min(count, room, 24);
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = speed * (0.5 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 40, life: 0.42 + Math.random() * 0.28, maxLife: 0.72, color, size: 2.8 + Math.random() * 2.5 });
  }
}

  gold += Math.max(1, Math.round(final / 15 * (heatGold > 0 ? 1.2 : 1))) * goldMul();
  saveGold(gold);
  updateGoldDisplay();
  if (!newRecordTriggered && currentTrackBest() > 0 && score > currentTrackBest()) {
    newRecordTriggered = true;

  }
  return final;
}

function destroyBrick(b, isChain) {
  if (!b || !b.alive) return;
  const lastClear = !b.steel && !b.regen && remainingBreakable() === 1;
  b.alive = false;
  matchStats.bricksBroken = (matchStats.bricksBroken || 0) + 1;
  markBricksDirty();
  markBricksDirty();
  if (b.regen) b.respawnAt = globalTime + REGEN_RESPAWN_DELAY;
  const pts = isChain ? Math.round(b.points / 2) : b.points;
  const final = scoreFor(pts);
  spawnBrickBurst(b, isChain, lastClear);
  spawnShockwave(b.x + b.w / 2, b.y + b.h / 2, b.color || '#ffd740', lastClear ? 56 : 38);
  ambientFlash = { color: b.color || '#40c4ff', intensity: lastClear ? 0.5 : 0.28 };
  if (lastClear) {
    triggerShake(2.5, 0.1);
  }
  // Ulti devredeyken yeni ulti şarjı kazanılamaz
  if (ultiActiveTimer <= 0) {
    ultiCharge = Math.min(100, ultiCharge + (isChain ? 0.15 : 0.32));
  }
  if (b.isBoss) {
    bossBullets = [];
    bossMines = [];
    checkAchievement('boss_slayer', 'Boss Avcısı!', 350);
    triggerShake(12, 0.45);
    triggerHitStop(0.08);
    spawnShockwave(b.x + b.w / 2, b.y + b.h / 2, '#ffd700', 120);
    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ffeb3b', 36, 260);
    announceEvent('BOSS ELİMİNE EDİLDİ!', '#ffd700', 'boss');
  }
  if (!isChain) {
    spawnFloatingText(b.x + b.w / 2, b.y + b.h / 2, '+' + final, effects.doublescore > 0 ? '#ec407a' : '#fff');
    spawnDrop(b);
    playSound('break', lastClear ? { last: true } : null);
    vibrate(lastClear ? 'combo' : 'break');
    registerCombo();
    trackQuest('bricks');
    try { progressQuest('q_bricks', 1); } catch(e) {}
    advanceCoach(1);
  } else if (lastClear) {
    playSound('break', { last: true });
    vibrate('combo');
  }
  if (b.goldCrate && !isChain) grantLuckyDrop(b.x + b.w / 2, b.y);

  // ❄️ Buz Tuğlası: Bitişik tuğlaları dondurur (tek vuruşluk cama dönüştürür)
  if (b.isIce && !isChain) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    spawnShockwave(cx, cy, '#80deea', 65);
    spawnParticles(cx, cy, '#e0f7fa', 16, 170);
    playSound('magic');
    bricks.forEach(other => {
      if (!other.alive || other === b || other.isBoss) return;
      const ocx = other.x + other.w / 2, ocy = other.y + other.h / 2;
      if (Math.hypot(ocx - cx, ocy - cy) < b.w * 2.2) {
        other.hp = 1;
        other.maxHp = 1;
        other.color = '#e0f7fa';
        other.steel = false;
        other.jelly = 1;
      }
    });
    spawnFloatingText(cx, cy, '❄️ DONDURULDU!', '#80deea', false);
  }

  // ⚡ Tesla Tuğlası: 3 yakın tuğlaya şimşek arkı çaktırır
  if (b.isTesla && !isChain) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    spawnShockwave(cx, cy, '#ffeb3b', 70);
    playSound('laser');
    vibrate('wall');
    triggerChainLightning(cx, cy);
    spawnFloatingText(cx, cy, '⚡ TESLA ŞOKU!', '#ffd54f', false);
  }

  if (effects.bomb > 0 && !isChain) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const radius = b.w * (1.15 + 0.45 * Math.max(1, effectRank('bomb')));
    triggerShake(6, 0.18);
    triggerHitStop(0.045);
    vibrate([30, 50, 30]);
    bricks.forEach(other => {
      if (!other.alive || other.steel || other.isBoss) return;
      const ocx = other.x + other.w / 2, ocy = other.y + other.h / 2;
      if (Math.hypot(ocx - cx, ocy - cy) < radius) destroyBrick(other, true);
    });
  }
}

function fillTuftCell(b) {
  if (!b || !b.tuft || b.filled || !tuftCellOpen(b)) return false;
  b.filled = true;
  b.color = b.yarn || '#c62828';
  b.jelly = 1;
  spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color, 4, 80);
  return true;
}
function tuftFrontRow() {
  let front = -1;
  if (!bricks) return front;
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    if (b && b.tuft && !b.filled) front = Math.max(front, b.row | 0);
  }
  return front;
}
function tuftCellOpen(b) {
  return !!(b && b.tuft && !b.filled && (b.row | 0) === tuftFrontRow());
}
function pulseTuftFront() {
  const fr = tuftFrontRow();
  if (fr < 0 || !bricks) return;
  bricks.forEach(other => {
    if (other.tuft && !other.filled && (other.row | 0) === fr) other.jelly = 1;
  });
}
function hitBrick(b, ball) {
  if (!b || !b.alive) return 'miss';
  if (b.tuft) {
    if (b.filled) return 'tuft';
    if (!tuftCellOpen(b)) {
      playSound('wall');
      b.jelly = 0.18;
      return 'steel';
    }
    fillTuftCell(b);
    playSound('crack');
    registerCombo();
    scoreFor(b.points || 8);
    updateLevelHud();
    pulseTuftFront();
    if (remainingBreakable() <= 0) setTimeout(finishTuftCanvas, 180);
    return 'steel';
  }
  if (b.steel && b.heavy) {
    const load = (ball && (ball.overload || 0)) || 0;
    if (load >= MAX_OVERLOAD) {
      if (ball) ball.overload = 0;
      destroyBrick(b, false);
      triggerShake(5, 0.16);
      playSound('break', { last: true });
      return 'destroyed';
    }
    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ff8a50', 5, 90);
    playSound('steel');
    b.jelly = 0.4;
    return 'steel';
  }
  if (b.steel) {
    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#cfd8dc', 4, 90);
    spawnShockwave(b.x + b.w / 2, b.y + b.h / 2, '#cfd8dc', 20);
    playSound('steel');
    vibrate('wall');
    b.jelly = 0.55;
    return 'steel';
  }
  if (b.isBoss && bossShieldsActive(b)) {
    spawnShockwave(b.x + b.w / 2, b.y + b.h / 2, '#00e5ff', 40);
    spawnFloatingText(b.x + b.w / 2, b.y - 12, '🛡️ KALKAN AKTİF!', '#00e5ff', false);
    playSound('steel');
    vibrate('wall');
    return 'steel';
  }
  // Zayıf Nokta (Weakpoint) ve Kritik Vuruş
  if (ball && b.weakpoint && b.hp > 1) {
    const wx = b.x + b.w * (b.weakpoint.xFrac || 0.5);
    const wy = b.y + b.h * (b.weakpoint.yFrac || 0.5);
    if (Math.hypot(ball.x - wx, ball.y - wy) < 14) {
      b.hp = Math.max(0, b.hp - 2);
      triggerHitStop(0.06);
      triggerShake(6, 0.2);
      spawnShockwave(wx, wy, '#ffd700', 50);
      spawnParticles(wx, wy, '#ffd700', 20, 200);
      spawnFloatingText(wx, wy - 10, '🎯 KRİTİK! x3', '#ffd700', true);
      announceEvent('KRİTİK VURUŞ!', '#ffd700', 'normal');
      playSound('laser');
      vibrate('combo');
    }
  }
  b.hp--;
  b.jelly = 1;
  if (effects.lightning > 0) {
    triggerChainLightning(b.x + b.w / 2, b.y + b.h / 2);
  }
  if (b.hp <= 0) { destroyBrick(b, false); return 'destroyed'; }
  spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color, 4, 95);
  spawnShockwave(b.x + b.w / 2, b.y + b.h / 2, b.color, 24);
  playSound('crack');
  vibrate('brick');
  return 'cracked';
}

function applyPowerUp(type) {

    snapshot.forEach(source => {
      if (!source || balls.length >= MAX_BALLS) return;
      const spd = BASE_LAUNCH_SPEED * currentSpeedMult();
      const baseVx = source.stuck ? 40 : source.vx;
      const baseVy = source.stuck ? -spd : (source.vy || -spd);
      for (let i = 0; i < 2 && balls.length < MAX_BALLS; i++) {
        const j = i === 0 ? -1 : 1;
        balls.push({
          x: Math.max(12, Math.min(VW - 12, source.x + j * 12)),
          y: source.y,
          r: source.r || 8,
          vx: baseVx + j * 80,
          vy: baseVy,
          stuck: false,
          stickFrac: 0.5,
          trail: [],
          canStick: true,
          stuckBounceCount: 0,
          lastBounceKey: null,
          lastBrickHitAt: globalTime,
          wallHits: 0,
          isMirror: !!source.isMirror
        });

    effects.shieldCharges++;
  } else if (type === 'pierce') {
    effects.pierceCharges = Math.min(12, (effects.pierceCharges || 0) + 6);
  } else if (type === 'mirror') {
    const source = balls.find(b => !b.stuck) || balls[0];
    if (source && balls.length < MAX_BALLS) {
      balls.push({ ...source, x: VW - source.x, vx: -source.vx, vy: source.vy, stuck: false, trail: [], canStick: true, isMirror: true });
      triggerHitStop(0.04);
    }
  } else if (type === 'lock') {
    let bestBrick = null;
    bricks.forEach(b => { if (b.alive && !b.steel && (!bestBrick || b.points > bestBrick.points)) bestBrick = b; });
    effects.lockTargetBrick = bestBrick;
  } else {
    bumpEffectRank(type);
    effects[type] = def.duration + upgradeLvl('battery');
    if (type === 'chrono') {
      ambientFlash = { color: '#80d8ff', intensity: 0.6 };
      triggerHitStop(0.08);

    } else if (type === 'drone') {
      spawnParticles(paddle.x + paddle.w / 2, paddle.y - 28, '#00e676', 15, 140);
      announceEvent('DESTEK DRONU DEVREDE!', '#00e676', 'powerupGood');
    } else if (type === 'invis') {
      announceEvent('RAKET KAYBOLDU!', '#cfd8dc', 'powerupBad');
    }
  }
  const stacked = type === 'multi' ? effectRank('multi') : effectRank(type);
  if (stacked > 1) {
    spawnFloatingText(paddle.x + paddle.w / 2, paddle.y - 48, 'x' + stacked, '#ffd740', true);
  }
}

function reflectOffRect(ball, b) {

}

function bounceBallOffPaddle(ball, maxSpeed) {
  const hitPos = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
  const edge = Math.abs(hitPos) > 0.78;
  if (effects.sticky > 0 && ball.canStick !== false && !(ball.stickLock > 0)) {
    ball.stuck = true;
    ball.stuckAt = globalTime;
    ball.vx = 0;
    ball.vy = 0;
    ball.stickFrac = Math.max(0, Math.min(1, (ball.x - paddle.x) / Math.max(1, paddle.w)));
    ball.x = paddle.x + ball.stickFrac * paddle.w;
    ball.y = paddle.y - ball.r - 2;
    triggerPaddleSquash();
    playPaddleThunk(edge);
    return;
  }
  const smoothAngle = Math.max(-0.85, Math.min(0.85, hitPos)) * (Math.PI / 3.1);
  const isMovingWithBall = Math.sign(paddle.vx || 0) === Math.sign(hitPos);
  const isFastSwipe = Math.abs(paddle.vx || 0) > 180;
  const perfectRebound = isFastSwipe && isMovingWithBall;

  let speed = Math.min(maxSpeed, Math.hypot(ball.vx, ball.vy) + PADDLE_BOUNCE_INCREMENT);
  if (perfectRebound) {
    speed = Math.min(maxSpeed * 1.15, speed + 24);
    ball.overload = MAX_OVERLOAD;
    announceEvent('PERFECT!', '#ffd54f', 'normal');
    spawnFloatingText(paddle.x + paddle.w / 2, paddle.y - 20, '✨ PERFECT! ✨', '#ffd54f', true);
    spawnShockwave(ball.x, paddle.y, '#ffd54f', 50);
    score += 50;
    matchStats.perfectRebounds = (matchStats.perfectRebounds || 0) + 1;
    vibrate('combo');
  }
  ball.wallBounces = 0;

  // Raket Yetenekleri (Perks):
  // pgold: +15% Altın bonusu
  // pneo / neon*: Ulti dolum bonusu
  // pice: Daha kontrollü dönüş
  const ultiBoost = (selectedPaddle === 'pneo' || selectedPaddle.startsWith('neon')) ? 1.12 : 1.0;
  const controlMul = (selectedPaddle === 'pice') ? 0.88 : 1.0;

  ball.vx = speed * Math.sin(smoothAngle * controlMul) + paddle.vx * SPIN_TRANSFER;
  ball.vy = -Math.abs(speed * Math.cos(smoothAngle * controlMul));
  ball.y = paddle.y - ball.r - 1;
  ball.overload = Math.min(MAX_OVERLOAD, (ball.overload || 0) + (perfectRebound ? 2 : 1));
  ball.lastBrickHitAt = globalTime;
  triggerPaddleSquash();
  spawnParticles(ball.x, paddle.y, edge ? '#ffd54f' : '#ffffff', edge ? 14 : 8, edge ? 140 : 90);
  spawnShockwave(ball.x, paddle.y, edge ? '#ffd54f' : '#ffffff', edge ? 38 : 28);
  paddleHitPulse = { x: ball.x - paddle.x, time: 0.22, color: edge ? '#ffd54f' : '#ffffff' };
  triggerShake(edge ? 3.5 : 2.0, 0.08);
  if (ultiActiveTimer <= 0) {
    ultiCharge = Math.min(100, ultiCharge + (edge ? 0.28 : 0.12) * ultiBoost);
  }
  if (clutchTriggered) {
    clutchTriggered = false;
    clutchSaveSlow = 0;
    score += 150;
    progressQuest('q_clutch', 1);
    announceEvent('CLUTCH SAVE!', '#00e5ff', 'clutch');
    spawnFloatingText(paddle.x + paddle.w / 2, paddle.y - 24, '⚡ CLUTCH SAVE! +150', '#00e5ff', true);
    spawnShockwave(paddle.x + paddle.w / 2, paddle.y, '#00e5ff', 80);
    triggerShake(8.0, 0.25);
    vibrate('combo');
  }
  playPaddleThunk(edge);
}
function playPaddleThunk(edge) {
  playSound('bounce');
  try { vibrate(edge ? 'heavy' : 'paddle'); } catch (e) {}
  if (!audioCtx || sfxMuted()) return;
  try {
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(edge ? 160 : 96, now);
    o.frequency.exponentialRampToValueAtTime(42, now + 0.08);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.1 * sfxVol), now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    o.connect(g).connect(audioCtx.destination);
    o.start(now);
    o.stop(now + 0.11);
  } catch (e) {}
}

function stepBallOnce(ball, subDt, maxSpeed, speedFactor) {
  ball.x += ball.vx * speedFactor * subDt;
  ball.y += ball.vy * speedFactor * subDt;

  if (ball.x - ball.r < 0.4 || (ball.x - ball.r < 3 && ball.vx < 0)) {
    ball.x = ball.r + 5;
    ball.vx = Math.max(MIN_WALL_VX, Math.abs(ball.vx));
    playSound('wall');
    vibrate('wall');
    spawnWallFlash(2, ball.y, '#40c4ff');
    spawnShockwave(ball.x, ball.y, '#40c4ff', 22);
    triggerShake(1.6, 0.05);
    registerBounceAndCheckStuck(ball);
  } else if (ball.x + ball.r > VW - 0.4 || (ball.x + ball.r > VW - 3 && ball.vx > 0)) {
    ball.x = VW - ball.r - 5;
    ball.vx = -Math.max(MIN_WALL_VX, Math.abs(ball.vx));
    playSound('wall');
    vibrate('wall');
    spawnWallFlash(VW - 2, ball.y, '#40c4ff');
    spawnShockwave(ball.x, ball.y, '#40c4ff', 22);
    triggerShake(1.6, 0.05);
    registerBounceAndCheckStuck(ball);
  }
  if (ball.y - ball.r < 0) {
    ball.y = ball.r + 1.5;
    if (ball.vy < 0) ball.vy = Math.abs(ball.vy);
    if (Math.abs(ball.vx) < MIN_WALL_VX * 0.55) {
      ball.vx = (ball.x < VW / 2 ? 1 : -1) * MIN_WALL_VX;
    }
    playSound('wall');
    vibrate('wall');
    spawnWallFlash(ball.x, 2, '#40c4ff');
    spawnShockwave(ball.x, ball.y, '#40c4ff', 22);
    triggerShake(1.6, 0.05);
    registerBounceAndCheckStuck(ball);
  }

  const magnetPad = PADDLE_MAGNET + effectRank('sticky') * 7;
  const overlapX = ball.x + ball.r > paddle.x && ball.x - ball.r < paddle.x + paddle.w;
  const throughPaddle = overlapX && ball.y + ball.r > paddle.y - magnetPad && ball.y < paddle.y + paddle.h + 18;
  const cameFromAbove = (ball.y - ball.vy * speedFactor * subDt) + ball.r <= paddle.y + 3;
  if (!paddle.exploded && !ball.stuck && throughPaddle && (ball.vy > -30 || cameFromAbove || ball.y + ball.r > paddle.y)) {
    bounceBallOffPaddle(ball, maxSpeed);
    return;
  }

  if (obstacle && remainingBreakable() > ENDGAME_BRICKS &&
      ballHitsRect(ball, obstacle.x, obstacle.y, obstacle.w, obstacle.h)) {
    reflectOffRect(ball, { x: obstacle.x, y: obstacle.y, w: obstacle.w, h: obstacle.h, hitY: obstacle.y });
    playSound('steel');
    registerBounceAndCheckStuck(ball);
    return;
  }

  // Pinball Tamponları (Bumpers) Çarpışması
  if (bumpers && bumpers.length) {
    for (let bi = 0; bi < bumpers.length; bi++) {
      const bmp = bumpers[bi];
      const bdx = ball.x - bmp.x, bdy = ball.y - bmp.y;
      const bdist = Math.hypot(bdx, bdy);
      if (bdist < ball.r + bmp.r) {
        const nx = bdist > 0.001 ? bdx / bdist : 0;
        const ny = bdist > 0.001 ? bdy / bdist : -1;
        const spd = Math.max(300, Math.hypot(ball.vx, ball.vy) + 25);
        ball.vx = nx * spd;
        ball.vy = ny * spd;
        ball.x = bmp.x + nx * (ball.r + bmp.r + 2);
        ball.y = bmp.y + ny * (ball.r + bmp.r + 2);
        bmp.hitPulse = 0.28;
        spawnShockwave(bmp.x, bmp.y, '#ff00e5', 42);
        spawnParticles(bmp.x, bmp.y, '#ff00e5', 12, 140);
        spawnFloatingText(bmp.x, bmp.y - 12, '+25', '#ff00e5', false);
        score += 25;
        triggerShake(2.5, 0.08);
        playSound('bounce');
        vibrate('impact');
        return;
      }
    }
  }

  // Boss Uydu Kalkanları Çarpışması
  const liveBoss = bricks && bricks.find(b => b.alive && b.isBoss);
  if (liveBoss && liveBoss.shields) {
    const bcx = liveBoss.x + liveBoss.w / 2, bcy = liveBoss.y + liveBoss.h / 2;
    const orbitR = Math.max(liveBoss.w, liveBoss.h) * 0.72;
    for (let si = 0; si < liveBoss.shields.length; si++) {
      const sh = liveBoss.shields[si];
      if (sh.hp <= 0) continue;
      const sx = bcx + Math.cos(sh.ang) * orbitR;
      const sy = bcy + Math.sin(sh.ang) * orbitR;
      if (Math.hypot(ball.x - sx, ball.y - sy) < ball.r + 9) {
        sh.hp--;
        ball.vy = -ball.vy;
        spawnShockwave(sx, sy, '#00e5ff', 35);
        spawnParticles(sx, sy, '#00e5ff', 12, 140);
        triggerShake(3, 0.1);
        playSound('steel');
        vibrate('impact');
        if (sh.hp <= 0) {
          spawnShockwave(sx, sy, '#00e5ff', 60);
          spawnFloatingText(sx, sy - 12, '💥 KALKAN PARÇALANDI!', '#00e5ff', true);
          announceEvent('KALKAN PARÇALANDI!', '#00e5ff', 'normal');
        } else {
          spawnFloatingText(sx, sy - 10, '🛡️ -1 HP', '#00e5ff', false);
        }
        return;
      }
    }
  }

  let hitAny = false;
  let deepest = null;
  let deepestArea = 0;
  for (const b of bricks) {
    if (!b.alive) continue;
    // 👻 Hayalet Tuğla: Faz döngüsündeyken top içinden geçer
    if (b.isGhost && Math.sin(globalTime * 3.0 + (b.col || 0)) < -0.15) continue;
    const by = brickHitY(b);
    if (!ballHitsRect(ball, b.x, by, b.w, b.h)) continue;
    const ox = Math.min(ball.x + ball.r, b.x + b.w) - Math.max(ball.x - ball.r, b.x);
    const oy = Math.min(ball.y + ball.r, by + b.h) - Math.max(ball.y - ball.r, by);
    const area = Math.max(0, ox) * Math.max(0, oy);
    if (area >= deepestArea) {
      deepestArea = area;
      deepest = b;
    }
  }
  if (deepest) {
    const b = deepest;
    const by = brickHitY(b);
    const result = hitBrick(b, ball);
    ball.lastBrickHitAt = globalTime;
    ball.stuckBounceCount = 0;
    if (effects.lockTargetBrick && effects.lockTargetBrick.alive) {
      const target = effects.lockTargetBrick;
      effects.lockTargetBrick = null;
      if (target !== b) {
        triggerShake(5, 0.2);
        vibrate([15, 30, 15, 30, 60]);
          spawnFloatingText(target.x + target.w / 2, target.y + target.h / 2 - 6, t('lockHit'), '#ffab00', true);
        destroyBrick(target, false);
      }
    }
    const isPlasma = (ball.plasmaCharge > 0) && result !== 'steel';
    if (isPlasma) {
      ball.plasmaCharge--;
      spawnParticles(ball.x, ball.y, '#00e5ff', 14, 160);
      spawnFloatingText(ball.x, ball.y - 12, '⚡ DELİCİ!', '#00e5ff', false);
    }
    const piercing = isPlasma || (tuftMode && result === 'tuft') || (!tuftMode && (effects.fireball > 0 || effects.pierceCharges > 0 || feverTimer > 0) && result !== 'steel' && result !== 'tuft');
    if (effects.pierceCharges > 0 && result !== 'steel') {
      effects.pierceCharges = Math.max(0, effects.pierceCharges - 1);
    }
    if (!piercing) {
      reflectOffRect(ball, { x: b.x, y: by, w: b.w, h: b.h, hitY: by });
      registerBounceAndCheckStuck(ball);
    }
    hitAny = !piercing;
  }

    if (hitAny) {
    for (const b of bricks) {
      if (!b.alive) continue;
      const by = brickHitY(b);
      if (ballHitsRect(ball, b.x, by, b.w, b.h)) separateFromRect(ball, b.x, by, b.w, b.h);
    }
    let embedded = false;
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ballHitsRect(ball, b.x, brickHitY(b), b.w, b.h)) embedded = true;
    }
    if (embedded) {
      ball.embedFrames = (ball.embedFrames || 0) + 1;
      if (ball.embedFrames >= 2) unstickBall(ball);
    } else {
      ball.embedFrames = 0;
    }
  }

  const minVy = maxSpeed * (remainingBreakable() <= ENDGAME_BRICKS ? 0.28 : 0.2);
  if (Math.abs(ball.vy) < minVy) {
    ball.vy = (ball.vy >= 0 ? 1 : -1) * minVy;
  }
  kickOffSideWalls(ball);
}

function applyMagnetPull(ball, dt, maxSpeed) {
  const rank = effectRank('sticky');
  if (rank <= 0 || !ball || ball.stuck || ball.stickLock > 0) return;
  if (ball.y >= paddle.y - 6) return;
  const reach = stickyReach();
  const px = paddle.x + paddle.w / 2;
  const py = paddle.y;
  const dx = px - ball.x;
  const dy = py - ball.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 10 || dist > reach) return;
  const strength = rank === 1 ? 160 : rank === 2 ? 380 : 520;
  const pull = strength * dt * (1 - dist / reach);
  ball.vx += (dx / dist) * pull;
  ball.vy += (dy / dist) * pull * 0.75;
  const spd = Math.hypot(ball.vx, ball.vy);
  const cap = Math.max(220, (maxSpeed || 540) * 1.05);
  if (spd > cap) {
    ball.vx *= cap / spd;
    ball.vy *= cap / spd;
  }
}

function updateBall(ball, dt, speedFactor, maxSpeed) {
  if (ball.stickLock > 0) {
    ball.stickLock -= dt;
    if (ball.stickLock <= 0) ball.canStick = true;
  }
  if (ball.stuck) {
    ball.x = paddle.x + (ball.stickFrac != null ? ball.stickFrac : 0.5) * paddle.w;
    ball.y = paddle.y - ball.r - 2;
    if (effects.sticky <= 0 || (globalTime - (ball.stuckAt || globalTime) > 1.35)) launchBall(ball);
    return;
  }

  ball.trail.unshift({ x: ball.x, y: ball.y });
  const extra = !!(ball.isMirror || (balls[0] && ball !== balls[0]));
  const spec = trailSpec();
  const trailMax = extra ? spec.extra : spec.len;
  if (ball.trail.length > trailMax) ball.trail.length = trailMax;

  let localSpeedFactor = speedFactor;
  if (effects.net > 0 && ball.y > paddle.y - netZoneH()) {
    localSpeedFactor *= effectRank('net') >= 2 ? 0.32 : NET_SLOW_FACTOR;
  }
  const moveDist = Math.hypot(ball.vx, ball.vy) * localSpeedFactor * dt;
  const steps = Math.min(16, Math.max(1, Math.ceil(moveDist / Math.max(2.5, ball.r * 0.65))));
  const subDt = dt / steps;
  for (let s = 0; s < steps; s++) {
    applyGravityWells(ball, subDt, maxSpeed);
    try { checkBallWormhole(ball); } catch(e) {}
    stepBallOnce(ball, subDt, maxSpeed, localSpeedFactor);
    clampBallInPlay(ball, true);
    if (ball.stuck) break;
  }
  if (ball.wormholeCooldown > 0) ball.wormholeCooldown = Math.max(0, ball.wormholeCooldown - dt);

  applyMagnetPull(ball, dt, maxSpeed);
  clampBallInPlay(ball, true);

  if (ball.y - ball.r > VH) {
    if (!tuftMode && remainingBreakable() <= 0) {
      ball.y = paddle.y - ball.r - 8;
      ball.vy = -Math.abs(ball.vy || 220);
      ball.vx *= 0.35;
      ball.dead = false;
    } else if (effects.shieldCharges > 0) {
      effects.shieldCharges--;
      ball.y = paddle.y - ball.r - 1;
      ball.x = Math.max(ball.r, Math.min(VW - ball.r, ball.x));
      ball.vy = -Math.abs(ball.vy || 200);
    } else {
      ball.dead = true;
    }
  } else {
    clampBallInPlay(ball, true);
  }
}

function applyThemeBackground() {
  if (gameState === 'playing' || gameState === 'ready' || gameState === 'levelTransition' || gameState === 'over') {
    document.body.style.background = themeForLevel().bg;
  } else {
    refreshMenuPalette(false);
  }
}

function updateHudOpacity() {
  let minY = Infinity;
  if (balls && balls.length) balls.forEach(b => { if (b.y < minY) minY = b.y; });
  const threshold = 90;
  let opacity = 1;
  if (gameState === 'playing' && minY < threshold) {
    opacity = Math.max(0.3, minY / threshold);
  }
  if (Math.abs(opacity - lastHudOpacity) > 0.04) {
    lastHudOpacity = opacity;
    hud.style.opacity = opacity;
  }
}

function update(dt) {
  globalTime += dt;
  tickMusic();
  updateHudOpacity();

  if (hitStopTimer > 0) { hitStopTimer = Math.max(0, hitStopTimer - dt); return; }

  if (gameState === 'levelTransition') {
    transitionTimer -= dt;
    bricks.forEach(b => {
      if (b.slideOffset > 0) {
        b.slideOffset = Math.max(0, b.slideOffset - BRICK_SLIDE_SPEED * dt);
      }
    });
    tickFloats(dt);
    tickParticles(dt);
    if (transitionTimer <= 0) {
      bricks.forEach(b => { b.slideOffset = 0; });
      goToReady();
    }
    return;
  }

  if (gameState === 'deathSequence') {
    deathTimer -= dt;
    if (shake.timeLeft > 0) shake.timeLeft = Math.max(0, shake.timeLeft - dt);
    const slowDt = dt * 0.35;
    tickParticles(slowDt);
    tickFloats(slowDt);
    if (deathTimer <= 0) {
      paddle.exploded = false;
      gameState = 'ready';
      resetBallAndPaddle();
      goToReady();
    }
    return;
  }

  updateStardust(dt);
  if (gameState !== 'playing') return;

  if (announcerTimer > 0) announcerTimer = Math.max(0, announcerTimer - dt);
  if (clutchCooldown > 0) clutchCooldown = Math.max(0, clutchCooldown - dt);
  updateWormholes(dt);

  // Matrix Clutch Save Kontrolü: Tek can kalmışken ve top raketin altından düşmek üzereyken
  if (lives === 1 && clutchCooldown <= 0 && balls && balls.length === 1 && paddle && !paddle.exploded) {
    const b = balls[0];
    if (b && !b.stuck && b.vy > 120 && b.y >= paddle.y - 12 && b.y <= paddle.y + paddle.h + 24) {
      const distToCenter = Math.abs(b.x - (paddle.x + paddle.w / 2));
      if (distToCenter > paddle.w / 2 && distToCenter < paddle.w / 2 + 38) {
        clutchSaveSlow = 0.95;
        clutchCooldown = 5.0;
        clutchTriggered = true;
        announceEvent('SAVE IT!', '#ff1744', 'clutch');
        vibrate('impact');
      }
    }
  }

  if (clutchSaveSlow > 0) {
    clutchSaveSlow = Math.max(0, clutchSaveSlow - dt);
    dt *= 0.45; // Sadece son şans kurtarışında hafif ve yumuşak ağır çekim
  }
  if (bulletTimeTimer > 0) bulletTimeTimer = Math.max(0, bulletTimeTimer - dt);
  if (lastBrickSlow > 0) lastBrickSlow = Math.max(0, lastBrickSlow - dt);
  saveRunAcc = (saveRunAcc || 0) + dt;
  if (saveRunAcc > 2.5) { saveRunAcc = 0; saveLiveRun(); }

  elapsedPlayTime += dt;
  if (coachActive()) refreshCoachHud();
  if (dailyMode) {
    dailyTimeLeft -= dt;
    updateLevelHud();
    if (dailyTimeLeft <= 0) {
      dailyTimeLeft = 0;
      dailyWonThisRun = false;
      endGame({ allowAd: false });
      return;
    }
  }
  const stickyWas = effects.sticky;
  TIMED_KEYS.forEach(k => {
    if (effects[k] > 0) effects[k] = Math.max(0, effects[k] - dt);
    if (effects[k] <= 0 && effects.rank) effects.rank[k] = 0;
  });
  if (stickyWas > 0 && effects.sticky <= 0) releaseStuckBalls();
  updateEffectsHUD();

  if (shake.timeLeft > 0) shake.timeLeft = Math.max(0, shake.timeLeft - dt);
  if (juiceFlash > 0) juiceFlash = Math.max(0, juiceFlash - dt * 3.4);
  if (paddle.squashTimer > 0) paddle.squashTimer = Math.max(0, paddle.squashTimer - dt);
  if (bricks) {
    for (let i = 0; i < bricks.length; i++) {
      if (bricks[i].jelly > 0) bricks[i].jelly = Math.max(0, bricks[i].jelly - dt * 5.2);
    }
  }

  const left = remainingBreakable();
  const widthMult = paddleWidthMult() * (left > 0 && left <= ENDGAME_BRICKS ? 1.22 : 1);
  paddle.w = Math.min(VW * 0.94, paddle.baseW * widthMult);
  paddle.x = Math.max(0, Math.min(VW - paddle.w, paddle.x));
  updatePaddleSteer(dt);
  if (feverTimer > 0) feverTimer = Math.max(0, feverTimer - dt);
  tickGravityWells(dt);

  paddle.vx = dt > 0 ? (paddle.x - paddlePrevX) / dt : 0;
  paddlePrevX = paddle.x;

  // --- YENİ ARCADE SİSTEMLERİ DÖNGÜSÜ ---
  tickUfo(dt);
  tickCompanionDrone(dt);
  updateDroneLasers(dt);
  tickVortex(dt);
  updateBossMines(dt);

  // --- CANLI BOSS VE MERMİ MOTORU ---
  updateLiveBoss(dt);
  const bulletDt = (effects.chrono > 0) ? dt * 0.15 : dt;
  bossBullets.forEach(bb => {
    bb.y += bb.vy * bulletDt;

    // Top ile Boss Mermisi Çarpışması (Mermi Savuşturma / Parry Mekaniği)
    if (balls && balls.length) {
      for (let bi = 0; bi < balls.length; bi++) {
        const bl = balls[bi];
        if (!bl.stuck && Math.hypot(bl.x - bb.x, bl.y - bb.y) < bl.r + bb.r + 3) {
          bb.dead = true;
          spawnParticles(bb.x, bb.y, '#ffd54f', 12, 160);
          spawnShockwave(bb.x, bb.y, '#ffd54f', 40);
          triggerShake(3.0, 0.09);
          vibrate('light');
          playSound('laser');
          announceEvent('DEFLECT!', '#ffd54f', 'normal');
          score += 25;
          matchStats.deflections = (matchStats.deflections || 0) + 1;
          break;
        }
      }
    }

    // Raketle çarpışma
    if (!bb.dead && !paddle.exploded &&
        bb.y + bb.r > paddle.y && bb.y - bb.r < paddle.y + paddle.h &&
        bb.x + bb.r > paddle.x && bb.x - bb.r < paddle.x + paddle.w) {
      bb.dead = true;
      triggerShake(6, 0.22);
      vibrate('heavy');
      playSound('lifeLost');
      spawnParticles(bb.x, bb.y, '#f44336', 14, 130);
      spawnShockwave(bb.x, bb.y, '#f44336', 32);
      if (!tuftMode && !endlessMode && lives > 0) {
        lives--;
        updateLivesDisplay();
        if (lives <= 0) endGame({ allowAd: true });
      }
    }
  });
  bossBullets = bossBullets.filter(bb => !bb.dead && bb.y < VH + 20);

  // --- ULTI SÜPER GÜÇ ATEŞLEME (DENGELİ & ÖLÇÜLÜ LAZER) ---
  if (ultiActiveTimer > 0) {
    ultiActiveTimer = Math.max(0, ultiActiveTimer - dt);
    ultiFireTimer -= dt;
    if (ultiFireTimer <= 0) {
      ultiFireTimer = 0.95;
      lasers.push({ x: paddle.x + paddle.w / 2 - 2, y: paddle.y - 12, w: 4, h: 18 });
      playSound('pew');
    }
  }

  // --- BAŞARIM KONTROLLERİ ---
  if (combo >= 10) checkAchievement('combo10', '10x Kombo Çılgınlığı', 100);
  if (combo >= 15) checkAchievement('combo15', '15x Kombo Ustası', 250);
  if (balls && balls.length >= 4) checkAchievement('multi4', 'Top Yağmuru', 150);
  if (level >= 5) checkAchievement('level5', 'Usta Kırıcı', 200);

  if (obstacle && left > ENDGAME_BRICKS) {
    obstacle.x += obstacle.vx * dt;
    if (obstacle.x < 0) { obstacle.x = 0; obstacle.vx *= -1; }
    if (obstacle.x + obstacle.w > VW) { obstacle.x = VW - obstacle.w; obstacle.vx *= -1; }
  }

  let descendLost = false;
  if (descendMode && bricks && bricks.length) {
    const sample = bricks.find(b => b.alive) || bricks[0];
    const st = (sample && sample.fallStyle) || 'fall';
    let shift = 0;
    if (st === 'sine') shift = Math.sin(globalTime * 1.05) * 16;
    else if (st === 'zag') {
      const amp = 20;
      const cyc = (globalTime * 34) % (amp * 4);
      if (cyc < amp) shift = cyc;
      else if (cyc < amp * 2) shift = amp * 2 - cyc;
      else if (cyc < amp * 3) shift = -(cyc - amp * 2);
      else shift = -(amp * 4 - cyc);
    }
    let minBase = Infinity, maxEdge = -Infinity;
    bricks.forEach(b => {
      if (!b.alive) return;
      minBase = Math.min(minBase, b.moverBaseX);
      maxEdge = Math.max(maxEdge, b.moverBaseX + b.w);
    });
    if (Number.isFinite(minBase)) {
      if (minBase + shift < 6) shift = 6 - minBase;
      if (maxEdge + shift > VW - 6) shift = VW - 6 - maxEdge;
    }
    bricks.forEach(b => {
      if (!b.alive) return;
      if (b.fallWait > 0) b.fallWait -= dt;
      else b.y += (b.fallSpeed || 16) * dt;
      b.x = b.moverBaseX + shift;
      if (b.y + b.h >= paddle.y - 6) descendLost = true;
    });
  }
  bricks.forEach(b => {
    if (left <= ENDGAME_BRICKS) {
      if (b.alive && !b.steel && !b.isBoss) { b.hp = 1; b.isMover = false; }
      if (b.regen && !b.alive) b.respawnAt = null;
    }
    if (b.isMover && b.alive && !descendMode) {
      b.x = b.moverBaseX + Math.sin(globalTime * b.moverSpeed + b.moverPhase) * b.moverAmp;
    }
    if (b.regen) {
      if (!b.alive && b.respawnAt && globalTime >= b.respawnAt) {
        b.alive = true;
        markBricksDirty();
        b.hp = b.maxHp;
        b.respawnAt = null;
        b.spawnFlash = 1;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#69f0ae', 6, 120);
        playSound('powerupGood');
      }
      if (b.spawnFlash > 0) b.spawnFlash = Math.max(0, b.spawnFlash - dt * 1.5);
    }
  });
  if (descendMode && bricks && bricks.length) {
    const groups = {};
    bricks.forEach(b => {
      if (!b.alive) return;
      const key = String(Math.round((b.moverBaseX || b.x) / 4));
      (groups[key] = groups[key] || []).push(b);
    });
    Object.keys(groups).forEach(k => {
      const list = groups[k].sort((a, b) => a.y - b.y);
      for (let i = 1; i < list.length; i++) {
        const minY = list[i - 1].y + list[i - 1].h + 7;
        if (list[i].y < minY) list[i].y = minY;
      }
    });
  }
  if (descendLost) {
    bricks.forEach(b => {
      if (b.alive && b.y + b.h >= paddle.y - 16) {
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ff6d00', 16, 180);
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ffd740', 10, 140);
        b.alive = false;
      }
    });
    playSound('lifeLost');
    lastDeathWasDescend = true;
    endGame();
    document.getElementById('endTitle').textContent = t('descendOver');
    return;
  }

  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.y += DROP_SPEED * dt;
    if (d.y + d.h > paddle.y && d.y < paddle.y + paddle.h && d.x + d.w > paddle.x && d.x < paddle.x + paddle.w) {
      applyPowerUp(d.type);
      drops.splice(i, 1);
    } else if (d.y > VH) {
      drops.splice(i, 1);
    } else {
      const mag = upgradeLvl('magnet');
      if (mag > 0 && paddle) {
        const px = paddle.x + paddle.w / 2;
        const cx = d.x + d.w / 2;
        const reach = 90 + mag * 40;
        if (Math.abs(cx - px) < reach && d.y > paddle.y - 220) d.x += (px - cx) * Math.min(1, dt * (1.4 + mag * 0.7));
      }
    }
  }

  if (effects.laser > 0) {
    effects.laserCooldown -= dt;
    if (effects.laserCooldown <= 0) {
      const lr = effectRank('laser');
      lasers.push({ x: paddle.x + 10, y: paddle.y, w: 3, h: 14 });
      lasers.push({ x: paddle.x + paddle.w - 13, y: paddle.y, w: 3, h: 14 });
      if (lr >= 2) lasers.push({ x: paddle.x + paddle.w / 2 - 1.5, y: paddle.y, w: 3, h: 16 });
      effects.laserCooldown = lr >= 2 ? 0.28 : 0.45;
      playSound('pew');
    }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.y -= LASER_SPEED * dt;
    let hit = false;
    if (obstacle && l.x < obstacle.x + obstacle.w && l.x + l.w > obstacle.x && l.y < obstacle.y + obstacle.h && l.y + l.h > obstacle.y) {
      hit = true;
    }
    if (!hit) {
      for (const b of bricks) {
        if (!b.alive) continue;
        if (l.x < b.x + b.w && l.x + l.w > b.x && l.y < b.y + b.h && l.y + l.h > b.y) {
          hitBrick(b);
          hit = true;
          break;
        }
      }
    }
    if (hit || l.y < 0) lasers.splice(i, 1);
  }

  if (effects.rocket > 0) {
    effects.rocketCooldown -= dt;
    if (effects.rocketCooldown <= 0) {
