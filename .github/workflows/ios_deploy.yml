name: Deploy iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Apple Private Key for altool
        env:
          KEY_CONTENT: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          KEY_FILE="/Users/runner/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          export KEY_FILE
          ruby -e 'File.write(ENV["KEY_FILE"], ENV["KEY_CONTENT"].to_s.gsub("\\n", "\n").strip + "\n")'
          if grep -q "BEGIN EC PRIVATE KEY" "$KEY_FILE"; then
            openssl pkcs8 -topk8 -nocrypt -in "$KEY_FILE" -out "$KEY_FILE.pkcs8" && mv "$KEY_FILE.pkcs8" "$KEY_FILE"
          fi
          cp "$KEY_FILE" "/Users/runner/.private_keys/AuthKey_${KEY_ID}.p8"

      - name: Set up temporary Keychain and Import Certificate
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temp_runner_password_123"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          if [ -n "$P12_BASE64" ]; then
            python3 -c "
import base64, os, sys
p12_raw = os.environ.get('P12_BASE64', '').strip()
if not p12_raw:
    sys.exit(0)
cert_path = os.environ['RUNNER_TEMP'] + '/cert.p12'
raw_latin = p12_raw.encode('latin1')
if len(raw_latin) > 2 and raw_latin[0] == 0x30 and raw_latin[1] == 0x82:
    with open(cert_path, 'wb') as f:
        f.write(raw_latin)
    print('P12 recognized directly as raw binary')
else:
    if 'base64,' in p12_raw:
        p12_raw = p12_raw.split('base64,')[1]
    decoded = base64.b64decode(p12_raw, validate=False)
    with open(cert_path, 'wb') as f:
        f.write(decoded)
    print(f'P12 successfully decoded from base64 ({len(decoded)} bytes)')
"
            CLEAN_PW=$(echo "$P12_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CLEAN_PW" -A -t agg -f pkcs12 || \
            security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -t agg -f pkcs12 || \
            security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CLEAN_PW" -T /usr/bin/codesign -T /usr/bin/security || \
            security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "" -A -t agg -f pkcs12
            
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          fi

          echo "=== Code signing identities in keychain ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH || true

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -f "ios/Kirmatas_AppStore.mobileprovision" ]; then
            cp ios/Kirmatas_AppStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/738d2925-cf0d-43fd-b949-b83be9f4c4ce.mobileprovision
            cp ios/Kirmatas_AppStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/Kirmatas_AppStore.mobileprovision
          fi

      - name: Prepare Signing Assets via Fastlane
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cd ios
          bundle exec fastlane prepare_signing || fastlane prepare_signing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build iOS App (Archive)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          BUILD_NUMBER=$(( ${{ github.run_number }} + 102 ))
          flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect / TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          cd ios
          bundle exec fastlane upload_testflight || fastlane upload_testflight
